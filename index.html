  try{ const [W,H]=dims(p); const pg=await S.sources[p.src].doc.getPage(p.idx+1); const vp=pg.getViewport({scale:1, rotation:p.rot});
    const c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height); const ctx=c.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); await pg.render({canvasContext:ctx, viewport:vp}).promise;
    const d=ctx.getImageData(0,0,c.width,c.height).data, ink=r=>{ for(let x=0;x<c.width;x++){ const i=(r*c.width+x)*4; if(d[i]<235||d[i+1]<235||d[i+2]<235) return true; } return false; };
    const from=Math.max(Math.ceil(y1)+2, Math.floor(H*0.86)); let run=0;
    for(let r=from; r<c.height; r++){ if(!ink(r)){ run++; continue; }
      if(run>=6){ for(let q=r; q<c.height; q++) if(ink(q)) return H-(r-run/2); } run=0; }
    return 0; }catch(e){ return 0; }
}
function tableselSvg(a){ const sw=1/S.zoom; return `<g data-id="${a.id}"><rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" fill="rgba(21,128,61,.08)" stroke="#15803d" stroke-width="${1.5*sw}" stroke-dasharray="${5*sw} ${3*sw}"/></g>`; }
async function tableFromRegion(p, box){
  const runs=(await getRuns(p)).filter(r=>{ const cx=r.x+r.w/2, cy=r.y+r.h/2; return cx>=box.x && cx<=box.x+box.w && cy>=box.y && cy<=box.y+box.h && r.str.trim(); });
  if(!runs.length){ const none=!(await getRuns(p)).length; toast(none?'This page has no text yet. Use Recognise text first.':'No text found in that box'); return; }
  // rows: text on the same line
  runs.sort((a,b)=>a.base-b.base||a.x-b.x); const rows=[];
  for(const r of runs){ const row=rows[rows.length-1]; if(row && Math.abs(row.base-r.base)<Math.min(row.size,r.size)*0.5) row.runs.push(r); else rows.push({base:r.base, size:r.size, runs:[r]}); }
  // columns: the gaps that run down most of the table
  const x0=Math.floor(Math.min(...runs.map(r=>r.x))), x1=Math.ceil(Math.max(...runs.map(r=>r.x+r.w))); const cov=new Uint16Array(x1-x0+2);
  for(const row of rows){ const seen=new Uint8Array(cov.length); for(const r of row.runs) for(let x=Math.floor(r.x)-x0; x<Math.ceil(r.x+r.w)-x0; x++) if(!seen[x]){ seen[x]=1; cov[x]++; } }
  const limit = rows.length>=4 ? Math.floor(rows.length*0.15) : 0; const cols=[]; let st=-1;
  for(let x=0;x<cov.length;x++){ const busy=cov[x]>limit; if(busy && st<0) st=x; if(!busy && st>=0){ cols.push([st+x0, x+x0]); st=-1; } }
  if(st>=0) cols.push([st+x0, cov.length+x0]);
  // join columns separated by tiny gaps (spaces inside a cell)
  const merged=[]; for(const c of cols){ const m=merged[merged.length-1]; if(m && c[0]-m[1]<3) m[1]=c[1]; else merged.push([...c]); }
  const colOf=r=>{ let best=0, bo=-1; merged.forEach((c,i)=>{ const o=Math.min(c[1],r.x+r.w)-Math.max(c[0],r.x); if(o>bo){ bo=o; best=i; } }); return best; };
  const grid=rows.map(row=>{ const cells=merged.map(()=>[]); for(const r of row.runs.sort((a,b)=>a.x-b.x)) cells[colOf(r)].push(r.str.trim()); return cells.map(c=>c.join(' ')); });
  tableDialog(grid);
}
const isNum = s => /^-?(\d{1,3}(,\d{3})+|\d+)(\.\d+)?$/.test(s.trim());
// lines that wrap inside a cell come out as extra rows with the first column empty and no numbers: join them up
function joinWrapped(grid){
  const out=[];
  for(const r of grid){ const prev=out[out.length-1];
    if(prev && !r[0].trim() && r.some(c=>c.trim()) && !r.some(c=>isNum(c))){ prev.forEach((c,i)=>{ if(r[i] && r[i].trim()) prev[i]=(c?c+' ':'')+r[i].trim(); }); }
    else out.push([...r]); }
  return out;
}
function tableDialog(grid0){
  let grid=joinWrapped(grid0), joined=true;

  const risky=c=>/^[=+@]/.test(c) || (/^-/.test(c) && !isNum(c));
  const csvCell=c=>{ if(risky(c)){ const f='="'+c.replace(/"/g,'""')+'"'; return '"'+f.replace(/"/g,'""')+'"'; } return /[",\r\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c; };
  const pack=()=>({tsv:grid.map(r=>r.map(c=>{ c=c.replace(/[\t\r\n]+/g,' '); return risky(c)?"'"+c:c; }).join('\t')).join('\r\n'),
    html:'<table>'+grid.map(r=>'<tr>'+r.map(c=>`<td${risky(c)||!isNum(c)?' style="mso-number-format:\'\\@\'"':''}>${esc(c)}</td>`).join('')+'</tr>').join('')+'</table>',
    csv:grid.map(r=>r.map(csvCell).join(',')).join('\r\n')});

  modal(`<h2>Copy table to Excel</h2><div class="hint" data-info></div>
    <label class="chk" style="margin-top:8px;font-size:12.5px"><input type="checkbox" data-join checked> Join text that wraps onto a second line inside a cell</label>
    <div class="tprev" data-prev></div>

    (m,close)=>{ m.classList.add('wide');

      m.querySelector('[data-join]').onchange=e=>{ joined=e.target.checked; grid=joined?joinWrapped(grid0):grid0.map(r=>[...r]); draw(); }; draw();
      m.querySelector('[data-copy]').onclick=async()=>{ const {tsv,html}=pack();
        try{ if(window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([tsv],{type:'text/plain'}), 'text/html':new Blob([html],{type:'text/html'})})]);
             else await navigator.clipboard.writeText(tsv); close(true); toast('Copied. Paste it into Excel with Ctrl+V'); }

    });
}
function makeXlsx(grid){

    f('xl/workbook.xml','<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Table" sheetId="1" r:id="rId1"/></sheets></workbook>'),
    f('xl/_rels/workbook.xml.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'),
    f('xl/styles.xml','<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>'),

function xEndDrag(d){

    const near=Math.hypot(a.x2-a.x1,a.y2-a.y1)<12, size=D.text.size||14;
    const t={id:nid(), ...clone(D.text), type:'text', color:D.callout.color, size, text:'', callout:{x:a.x1, y:a.y1}, x:near?a.x1+30:a.x2, y:(near?a.y1-30:a.y2)-size*0.6};

  if(a.type==='field' && d.mode==='box'){

  if(a.type==='link' && d.mode==='box'){
    if(a.w<3 || a.h<3){ p.annots=p.annots.filter(x=>x!==a); renderOverlay(p); return true; }

    if(Math.hypot(a.x2-a.x1,a.y2-a.y1)<3){ p.annots=p.annots.filter(x=>x!==a); renderOverlay(p); return true; }

}

async function exportExtras(out, list, inPlace){

    for(const a of p.annots){ if(a.type!=='link') continue;
      const c1=toPdf(p,a.x,a.y), c2=toPdf(p,a.x+a.w,a.y+a.h); const rect=[Math.min(c1[0],c2[0]), Math.min(c1[1],c2[1]), Math.max(c1[0],c2[0]), Math.max(c1[1],c2[1])];
      if(a.kind==='url'){ if(!a.url) continue; const ctx=out.context;

const PAPER={A4:[595.28,841.89], A3:[841.89,1190.55], A5:[419.53,595.28], Letter:[612,792], Legal:[612,1008]};
function scaleAnnot(a, s, dx, dy){
  const X=v=>dx+v*s, Y=v=>dy+v*s;
  if(typeof a.x==='number') a.x=X(a.x); if(typeof a.y==='number') a.y=Y(a.y);
  if(typeof a.w==='number') a.w*=s; if(typeof a.h==='number') a.h*=s;
  for(const k of ['x1','x2']) if(typeof a[k]==='number') a[k]=X(a[k]);
  for(const k of ['y1','y2']) if(typeof a[k]==='number') a[k]=Y(a[k]);
  if(Array.isArray(a.pts)) a.pts=a.pts.map(([x,y])=>[X(x),Y(y)]);
  if(Array.isArray(a.rects)) a.rects=a.rects.map(q=>({...q, x:X(q.x), w:q.w*s, base:Y(q.base), size:q.size*s}));
  for(const k of ['size','fs','width','maxH','size0']) if(typeof a[k]==='number' && !(k==='fs' && a.type==='field' && !a.fs)) a[k]*=s;
  if(typeof a.base0==='number') a.base0=Y(a.base0);

// Draws each chosen page, as you see it, onto a new page of the chosen size. Your edits move with it.
async function resizePages(targets, opt){
  const out=await PDFDocument.create(); const tf={}; const made=[];
  for(const p of targets){
    const [Wd,Hd]=dims(p);
    let [TW,TH]= opt.size==='first' ? dims(S.pages[0]) : PAPER[opt.size];
    const land = opt.orient==='land' || (opt.orient==='match' && Wd>Hd);
    if(opt.size!=='first'){ if(land && TW<TH) [TW,TH]=[TH,TW]; if(!land && TW>TH) [TW,TH]=[TH,TW]; }
    const m=opt.margin||0; let s=Math.min((TW-2*m)/Wd, (TH-2*m)/Hd);
    if(opt.scale==='shrink') s=Math.min(1,s); else if(opt.scale==='none') s=Math.min(1, s);   // never spill off the page
    if(opt.scale==='none' && Wd<=TW-2*m && Hd<=TH-2*m) s=1;
    const dx=(TW-Wd*s)/2, dy=(TH-Hd*s)/2;
    const page=out.addPage([TW,TH]);
    if(p.src){
      const src=await libDoc(p.src); const emb=await out.embedPage(src.getPage(p.idx), {left:p.vx0, bottom:p.vy0, right:p.vx0+p.w0, top:p.vy0+p.h0});
      const o={xScale:s, yScale:s};
      if(p.rot===90) Object.assign(o,{x:dx, y:TH-dy, rotate:degrees(-90)});
      else if(p.rot===180) Object.assign(o,{x:dx+Wd*s, y:TH-dy, rotate:degrees(180)});
      else if(p.rot===270) Object.assign(o,{x:dx+Wd*s, y:TH-dy-Hd*s, rotate:degrees(90)});
      else Object.assign(o,{x:dx, y:TH-dy-Hd*s});
      page.drawPage(emb, o);
    }
    tf[p.id]={s,dx,dy,TW,TH}; made.push(p);
  }
  return {bytes:await out.save(), tf, made};
}

async function drawMarksWith(out, page, i, n, marks, fname, fonts){

async function a4Pages(doc){
  const out=await PDFDocument.create();
  for(const pg of doc.getPages()){ const box=pg.getCropBox(), rot=((pg.getRotation().angle%360)+360)%360; const swap=rot%180!==0;
    const Wd=swap?box.height:box.width, Hd=swap?box.width:box.height; let [TW,TH]=PAPER.A4; if(Wd>Hd) [TW,TH]=[TH,TW];
    const s=Math.min(TW/Wd, TH/Hd), dx=(TW-Wd*s)/2, dy=(TH-Hd*s)/2;
    const emb=await out.embedPage(pg, {left:box.x, bottom:box.y, right:box.x+box.width, top:box.y+box.height}); const np=out.addPage([TW,TH]);
    const o={xScale:s, yScale:s};
    if(rot===90) Object.assign(o,{x:dx, y:TH-dy, rotate:degrees(-90)}); else if(rot===180) Object.assign(o,{x:dx+Wd*s, y:TH-dy, rotate:degrees(180)});
    else if(rot===270) Object.assign(o,{x:dx+Wd*s, y:TH-dy-Hd*s, rotate:degrees(90)}); else Object.assign(o,{x:dx, y:TH-dy-Hd*s});
    np.drawPage(emb, o); }
  return out;
}

  const up=enc.encode(userPw||'').slice(0,127), op=enc.encode(ownerPw || toHex(rnd(16))).slice(0,127);
  const fileKey=rnd(32);
  const uV=rnd(8), uK=rnd(8); const U=catB(await hash2B(up,uV,none,R), uV, uK); const UE=await aesEnc(await hash2B(up,uK,none,R), iv0, fileKey, false);
  const oV=rnd(8), oK=rnd(8); const O=catB(await hash2B(op,oV,U,R), oV, oK); const OE=await aesEnc(await hash2B(op,oK,U,R), iv0, fileKey, false);
  let P=(0xFFFFF0C0|PERM.access)>>>0;
  if(allow.print) P|=PERM.print|PERM.hqprint; if(allow.edit) P|=PERM.edit|PERM.assemble; if(allow.copy) P|=PERM.copy; if(allow.notes) P|=PERM.notes; if(allow.forms) P|=PERM.forms|PERM.notes;
  P=P|0;
  const perms=new Uint8Array(16); new DataView(perms.buffer).setInt32(0,P,true); perms.fill(255,4,8); perms.set([0x54,0x61,0x64,0x62],8); perms.set(rnd(4),12);
  const Perms=await aesEnc(fileKey, iv0, perms, false);
  const doc=await PDFDocument.load(bytes, {updateMetadata:false}); const ctx=doc.context;
  const encOne=async data=>{ const iv=rnd(16); return catB(iv, await aesEnc(fileKey, iv, data, true)); };
  const encStr=async o=>{
    if(o instanceof PDFLib.PDFString || o instanceof PDFLib.PDFHexString) return PDFHexString.of(toHex(await encOne(o.asBytes())));
    if(o instanceof PDFLib.PDFDict){ for(const [k,v] of o.entries()){ const n=await encStr(v); if(n!==v) o.set(k,n); } return o; }
    if(o instanceof PDFLib.PDFArray){ for(let i=0;i<o.size();i++){ const v=o.get(i), n=await encStr(v); if(n!==v) o.set(i,n); } return o; }
    return o; };
  const N=PDFLib.PDFName;
  for(const [ref,obj] of [...ctx.enumerateIndirectObjects()]){
    if(obj instanceof PDFLib.PDFRawStream){ const t=obj.dict.lookup(N.of('Type')); if(t && t.toString()==='/XRef') continue;
      await encStr(obj.dict); ctx.assign(ref, PDFLib.PDFRawStream.of(obj.dict, await encOne(obj.contents))); }
    else if(obj instanceof PDFLib.PDFStream){ /* none after loading */ }
    else await encStr(obj);
  }
  const H=b=>PDFHexString.of(toHex(b));
  const E=ctx.obj({Filter:'Standard', V:5, R:6, Length:256, P:PDFLib.PDFNumber.of(P), O:H(O), U:H(U), OE:H(OE), UE:H(UE), Perms:H(Perms), EncryptMetadata:true,
    CF:ctx.obj({StdCF:ctx.obj({Type:'CryptFilter', AuthEvent:'DocOpen', CFM:'AESV3', Length:32})}), StmF:'StdCF', StrF:'StdCF'});
  ctx.trailerInfo.Encrypt=ctx.register(E);
  if(!ctx.trailerInfo.ID){ const id=H(rnd(16)); ctx.trailerInfo.ID=ctx.obj([id, id]); }
  return await doc.save({useObjectStreams:false, updateFieldAppearances:false});
}
// for files read outside the open documents (batch): unlock, asking for a password when one is needed
async function unlockIfNeeded(bytes, name){
  if(!isEncryptedBytes(bytes)) return bytes;
  let r=await unlockPdf(bytes, ''); let tries=0;
  while(r===null && tries<3){ const pw=await askText(`Password for ${name}`, '', 'Open'); if(pw==null) return null; r=await unlockPdf(bytes, pw); tries++; }
  return r ? r.bytes : null;
}
// open-time: keep a decrypted copy for saving; note whether the author restricted changes
async function prepareEncrypted(sid, pw){
  const src=S.sources[sid]; if(!isEncryptedBytes(src.bytes)) return;
  try{ const r=await unlockPdf(src.bytes, pw||''); if(!r) return;
    src.origBytes=src.bytes; src.bytes=r.bytes; src.enc=true; src.perms=r.P;
    src.restricted = !r.owner && !(r.P & PERM.edit);
    src.noPrint = !r.owner && !(r.P & PERM.print);
    src.hadUserPw = !!pw;
  }catch(e){ console.warn('unlock', e); src.enc=true; src.unsupported=e.message; }
}
async function checkRestrictions(list, forPrint){
  for(const id of new Set(list.map(p=>p.src).filter(Boolean))){ const src=S.sources[id]; if(!src) continue;
    if(src.unsupported) throw new Error(src.unsupported);
    const blocked = forPrint ? src.noPrint : src.restricted; if(!blocked) continue;
    const pw=await askText(forPrint?'The author of this PDF doesn’t allow printing. Enter the permissions password to print it.':'The author of this PDF restricted changes. Enter the permissions password to save.', '', 'Unlock');
    if(pw==null) throw new Error('cancelled');
    const r=await unlockPdf(src.origBytes||src.bytes, pw);
    if(!r || !r.owner){ toast('That isn’t the permissions password'); throw new Error('cancelled'); }
    src.restricted=false; src.noPrint=false; src.bytes=r.bytes; delete libDocCache[id];
  }
}

async function saveCopyBytes(bytes, suggested, title){

// remove what an archive file mustn't have: scripts, form fields, attachments, annotations other than links
function cleanForArchive(doc){
  const ctx=doc.context, N=PDFLib.PDFName, cat=doc.catalog; const removed=new Set();
  try{ const af=cat.lookup(N.of('AcroForm')), fl=af instanceof PDFLib.PDFDict && af.lookup(N.of('Fields')); if(fl && fl.size && fl.size()){ doc.getForm().flatten(); removed.add('form fields (their values are kept on the page)'); } }catch(_){}
  for(const k of ['OpenAction','AA','AcroForm','AF','Collection','NeedsRendering']) if(cat.get(N.of(k))){ cat.delete(N.of(k)); }
  const names=cat.lookup(N.of('Names'));
  if(names instanceof PDFLib.PDFDict){ if(names.get(N.of('EmbeddedFiles'))) removed.add('attached files'); names.delete(N.of('EmbeddedFiles')); names.delete(N.of('JavaScript')); }
  const emptyAP=()=>ctx.register(ctx.stream(new Uint8Array(0), {Type:'XObject', Subtype:'Form', BBox:[0,0,0,0]}));
  for(const pg of doc.getPages()){
    pg.node.delete(N.of('AA'));
    const arr=pg.node.Annots(); if(!arr) continue; const keep=[];
    for(let i=0;i<arr.size();i++){ const ref=arr.get(i), a=ctx.lookup(ref); if(!(a instanceof PDFLib.PDFDict)) continue; const st=String(a.get(N.of('Subtype')));
      if(st==='/Link'){ const A=a.lookup(N.of('A')); const s=A instanceof PDFLib.PDFDict ? String(A.get(N.of('S'))) : '';
        if(s && s!=='/URI' && s!=='/GoTo'){ a.delete(N.of('A')); }
        a.set(N.of('F'), PDFLib.PDFNumber.of(4)); if(!a.get(N.of('AP'))) a.set(N.of('AP'), ctx.obj({N:emptyAP()})); keep.push(ref); }
      else removed.add(st==='/Text'||st==='/Popup' ? 'comment notes (their text is lost; marks drawn on the page stay)' : 'other annotations'); }
    if(keep.length) pg.node.set(N.of('Annots'), ctx.obj(keep)); else pg.node.delete(N.of('Annots'));
  }
  return [...removed];
}
function fontProblems(doc, exempt){
  const ctx=doc.context, N=PDFLib.PDFName, bad=new Set();
  for(const [ref,o] of ctx.enumerateIndirectObjects()){
    const d = o instanceof PDFLib.PDFDict ? o : null; if(!d || String(d.get(N.of('Type')))!=='/Font' || exempt.has(ref.tag)) continue;
    const st=String(d.get(N.of('Subtype'))); if(st==='/Type3') continue;
    let fd=d.lookup(N.of('FontDescriptor'));
    if(st==='/Type0'){ const df=d.lookup(N.of('DescendantFonts')); const f0=df && ctx.lookup(df.get(0)); fd=f0 && f0.lookup(N.of('FontDescriptor')); }
    const ok = fd instanceof PDFLib.PDFDict && (fd.get(N.of('FontFile'))||fd.get(N.of('FontFile2'))||fd.get(N.of('FontFile3')));
    if(!ok) bad.add(String(d.get(N.of('BaseFont'))||'unnamed').replace(/^\/([A-Z]{6}\+)?/,''));
  }
  return [...bad];
}
// Each page as a picture, with the text kept (invisibly) so it can still be searched and copied
async function pagesAsPictures(bytes){
  const src=await pdfjsLib.getDocument({...PDFJS_OPTS, data:bytes.slice()}).promise; const out=await PDFDocument.create(); const font=await out.embedFont(StandardFonts.Helvetica); const exempt=new Set([font.ref.tag]);
  for(let i=1;i<=src.numPages;i++){ busy(true,`Making page ${i} of ${src.numPages} into a picture…`);
    const pg=await src.getPage(i); const vp1=pg.getViewport({scale:1}); const sc=Math.min(200/72, 3600/Math.max(vp1.width,vp1.height)); const vp=pg.getViewport({scale:sc});
    const cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height); const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:c, viewport:vp, intent:'print'}).promise;
    const jpg=new Uint8Array(await (await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85))).arrayBuffer()); cv.width=cv.height=0;
    const W=vp1.width, H=vp1.height, np=out.addPage([W,H]); np.drawImage(await out.embedJpg(jpg), {x:0, y:0, width:W, height:H});
    const tc=await pg.getTextContent(); const key=np.node.newFontDictionary('FInv', font.ref); const L=PDFLib; const ops=[];
    for(const it of tc.items){ if(!it.str || !it.str.trim()) continue; const m=pdfjsLib.Util.transform(vp1.transform, it.transform);
      if(Math.abs(m[1])>0.01 || Math.abs(m[2])>0.01) continue; const size=Math.hypot(m[2],m[3]) || Math.abs(m[3]); if(size<1) continue;
      const t=safeText(font, it.str); const w=font.widthOfTextAtSize(t, size); if(!w) continue; const sq=Math.max(1, Math.min(1000, it.width/w*100));
      ops.push(L.beginText(), L.setFontAndSize(key, size), L.setTextRenderingMode(L.TextRenderingMode.Invisible), L.setCharacterSqueeze(sq), L.setTextMatrix(1,0,0,1, m[4], H-m[5]), L.showText(font.encodeText(t)), L.endText()); }
    if(ops.length) np.pushOperators(...ops);
    pg.cleanup();
  }
  src.destroy(); return {doc:out, exempt};
}

/* ---------- Split: also by bookmarks or page ranges ---------- */
function bookmarkGroups(level){
  const starts=[]; const walk=(ns,d)=>{ for(const n of ns||[]){ const q=n.pid&&pageById(n.pid); if(q && d<=level) starts.push({i:S.pages.indexOf(q), title:n.title}); if(d<level) walk(n.kids,d+1); } };
  walk(S.outline,1); starts.sort((a,b)=>a.i-b.i);
  const uniq=[]; for(const s of starts){ if(uniq.length && uniq[uniq.length-1].i===s.i) continue; uniq.push(s); }
  if(!uniq.length) return [];
  const g=[]; if(uniq[0].i>0){ const x=S.pages.slice(0,uniq[0].i); x.title='Start'; g.push(x); }
  uniq.forEach((s,k)=>{ const x=S.pages.slice(s.i, k+1<uniq.length?uniq[k+1].i:S.pages.length); x.title=s.title; g.push(x); });
  return g.filter(x=>x.length);
}
function rangeGroups(text){
  const n=S.pages.length, g=[];
  for(const part of String(text).split(/[,;]+/)){ const m=part.trim().match(/^(\d+)\s*(?:[-–]\s*(\d+|end))?$/i); if(!m) continue;
    const a=Math.max(1,+m[1]), b=m[2]? (/end/i.test(m[2])?n:Math.min(n,+m[2])) : a; if(a<=b) g.push(S.pages.slice(a-1,b)); }
  return g;
}

// Opened from Windows ("Open with Folio" / double-click when Folio is the default PDF app)
window.__folioAction=(()=>{
  const q={combine:[], compress:[], toword:[], ocr:[]}, t={};
  const byName=(a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'});
  const uniq=hs=>[...new Map(hs.map(h=>[(h.path||h.name).toLowerCase(), h])).values()];
  const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
  async function combine(hs){
    hs=uniq(hs).sort(byName);
    if(hs.length<2){ await openFile(await hs[0].getFile(), hs[0]); toast('Select two or more PDFs, then right-click › Combine files in Folio'); return; }
    busy(true,`Combining ${hs.length} files…`); const out=await PDFDocument.create(); const bad=[]; let n=0;
    for(const h of hs){ try{ const src=await PDFDocument.load(await readFile(await h.getFile()), {updateMetadata:false}); (await out.copyPages(src, src.getPageIndices())).forEach(pg=>out.addPage(pg)); n++; }catch(e){ console.warn(e); bad.push(h.name); } }
    busy(false);
    if(!n){ toast('Could not combine those files'+(bad.length?' (they may be password-protected)':'')); return; }
    await openBytes(await out.save(), `Combined (${n} files).pdf`);
    toast(`Combined ${n} files in name order. Drag the page thumbnails to reorder, then Save.`+(bad.length?` Skipped (protected or damaged): ${bad.join(', ')}`:''));
  }
  async function compress(hs){
    const done=[], same=[], bad=[];
    for(const h of uniq(hs).sort(byName)){
      busy(true,`Compressing ${h.name}…`);
      try{ const f=await h.getFile(); const r=await compressPdf(await readFile(f), 'strong');
        if(!h.path || r.bytes.length>=f.size*0.97){ same.push(h.name); continue; }
        const base=h.path.replace(/\.pdf$/i,''); let target=base+' (compressed).pdf', k=2;
        while(await window.__folioExists(target)) target=`${base} (compressed ${k++}).pdf`;
        await window.__folioWritePath(target, r.bytes); done.push(`${h.name}: ${kb(f.size)} → ${kb(r.bytes.length)}`);
      }catch(e){ console.warn(e); bad.push(h.name); }
    }
    busy(false);
    toast((done.length?`Saved a compressed copy next to ${done.length===1?'the original':'each original'}. ${done.join(' · ')}`:'')+(same.length?` Already as small as it gets: ${same.join(', ')}.`:'')+(bad.length?` Couldn't compress: ${bad.join(', ')}.`:''));
  }
  async function ocrFiles(hs){
    hs=uniq(hs).sort(byName); const done=[], none=[], bad=[];
    for(const h of hs){
      try{ const before=docs.length; await openFile(await h.getFile(), h); const mine=docs.length>before ? active : null;
        for(const p of S.pages) if(p.src) await getRuns(p);
        const need=S.pages.filter(p=>p.src && nativeEmpty.has(okey(p)) && !S.ocr[okey(p)]);
        if(!need.length){ none.push(h.name); if(mine) removeDoc(mine); continue; }
        await ocrPages(need);
        if(!need.some(p=>S.ocr[okey(p)] && S.ocr[okey(p)].lines.length)){ bad.push(h.name+' (no readable text found)'); if(mine) removeDoc(mine); continue; }
        busy(true,`Saving ${h.name}…`); const bytes=await exportPdf();
        const base=h.path.replace(/\.pdf$/i,''); let target=base+' (searchable).pdf', k=2;
        while(await window.__folioExists(target)) target=`${base} (searchable ${k++}).pdf`;
        await window.__folioWritePath(target, bytes); done.push(target.split(/[\\/]/).pop());
        if(mine) removeDoc(mine);
      }catch(e){ console.warn(e); bad.push(h.name); }
    }
    busy(false);
    toast((done.length?`Saved searchable copies next to the originals: ${done.join(', ')}.`:'')+(none.length?` Already searchable: ${none.join(', ')}.`:'')+(bad.length?` Couldn't do: ${bad.join(', ')}.`:''));
  }
  async function toword(hs){
    hs=uniq(hs).sort(byName); const mode=await askWordMode(hs.length); if(!mode) return;
    const done=[], bad=[];
    for(const h of hs){
      busy(true,`Converting ${h.name} to Word…`);
      try{ const f=await h.getFile(); const docx=await pdfToWord(await readFile(f), mode, h.name, h.path, (i,n)=>busy(true,`Converting ${h.name}… page ${i} of ${n}`));
        const base=h.path.replace(/\.pdf$/i,''); let target=base+'.docx', k=1;
        while(await window.__folioExists(target)) target=`${base} (${k++}).docx`;
        await window.__folioWritePath(target, docx); done.push(target.split(/[\\/]/).pop());
      }catch(e){ console.warn(e); bad.push(`${h.name} (${wordError(e)})`); }
    }
    busy(false);
    toast((done.length?`Saved next to the original: ${done.join(', ')}.`:'')+(bad.length?` Couldn't convert: ${bad.join('; ')}`:''));
  }
  return async (action, hs)=>{
    if(action==='ocr'){ q.ocr.push(...hs); clearTimeout(t.ocr); t.ocr=setTimeout(()=>{ const list=q.ocr.splice(0); ocrFiles(list).catch(e=>{ busy(false); toast(String(e)); }); }, 1500); return; }
    if(action==='toword'){ q.toword.push(...hs); clearTimeout(t.toword); t.toword=setTimeout(()=>{ const list=q.toword.splice(0); toword(list).catch(e=>{ busy(false); toast(String(e)); }); }, 1500); return; }
    if(action==='combine'||action==='compress'){   // Windows starts Folio once per selected file: gather them up first
      q[action].push(...hs); clearTimeout(t[action]);
      t[action]=setTimeout(()=>{ const list=q[action].splice(0); (action==='combine'?combine:compress)(list).catch(e=>{ busy(false); console.error(e); toast(String(e)); }); }, 1500);
      return;
    }
    for(const h of hs){ try{ await openFile(await h.getFile(), h); }catch(e){ console.error(e); toast('Could not open '+(h.name||'that file')); } }
    if(!S.pages.length) return;
    if(action==='edit') setTool('edittext');
    else if(action==='sign') setTool('sign');
    else if(action==='protect') protectDialog();
    else if(action==='split') splitDialog();
  };
})();
// ---- PDF to Word: "Exact look" (each page a full-page picture) or "Editable text" (Microsoft Word's own conversion)
async function askWordMode(n){
  return modal(`<h2>Convert to Word</h2><div class="hint" style="margin-bottom:12px">${n>1?n+' files. ':''}How should the Word ${n>1?'documents':'document'} look?</div>

      <label class="chk" style="margin-top:8px"><input type="radio" name="wm" value="edit"> <span><b>Editable text</b>: Microsoft Word rebuilds the text so you can edit it. Simple documents convert well; designed pages, tables and forms may shift</span></label>
    </div><div class="foot"><button class="btn out" data-c>Cancel</button><button class="btn pri" data-o>Convert</button></div>`,
    (m,close)=>{ m.querySelector('[data-c]').onclick=()=>close(null); m.querySelector('[data-o]').onclick=()=>close(m.querySelector('input[name=wm]:checked').value); });

async function pictureDocx(pdfBytes, progress){
  const doc=await pdfjsLib.getDocument({...PDFJS_OPTS, data:pdfBytes.slice()}).promise;
  const files=[], rels=[], body=[];
  const MAXTW=31680;   // Word's largest page: 22 inches
  for(let i=1;i<=doc.numPages;i++){
    if(progress) progress(i, doc.numPages);
    const pg=await doc.getPage(i); const v1=pg.getViewport({scale:1});
    const fit=Math.min(1, MAXTW/(v1.width*20), MAXTW/(v1.height*20));
    const wPt=v1.width*fit, hPt=v1.height*fit;
    const scale=Math.min(200/72, 6000/Math.max(v1.width, v1.height));
    const vp=pg.getViewport({scale}); const c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x, viewport:vp}).promise;
    const jpg=new Uint8Array(await (await new Promise(r=>c.toBlob(r,'image/jpeg',0.88))).arrayBuffer()); c.width=c.height=0;
    files.push({name:`word/media/p${i}.jpeg`, data:jpg});
    rels.push(`<Relationship Id="rIdP${i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/p${i}.jpeg"/>`);
    const cx=Math.round(wPt*12700), cy=Math.round((hPt-1.5)*12700);
    const sect=`<w:sectPr><w:pgSz w:w="${Math.round(wPt*20)}" w:h="${Math.round(hPt*20)}"${wPt>hPt?' w:orient="landscape"':''}/><w:pgMar w:top="0" w:right="0" w:bottom="0" w:left="0" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr>`;
    const pic=`<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${i}" name="Page ${i}"/><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${i}" name="Page ${i}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdP${i}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
    const ppr=`<w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:rPr><w:sz w:val="2"/></w:rPr>${i<doc.numPages?sect:''}</w:pPr>`;
    body.push(`<w:p>${ppr}${pic}</w:p>`);
    if(i===doc.numPages) body.push(sect);
  }
  const ns='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const enc=s=>new TextEncoder().encode(s);
  return makeZip([
    {name:'[Content_Types].xml', data:enc(X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')},
    {name:'_rels/.rels', data:enc(X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')},
    {name:'word/_rels/document.xml.rels', data:enc(X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels.join('')+'</Relationships>')},
    {name:'word/document.xml', data:enc(X+`<w:document ${ns}><w:body>${body.join('')}</w:body></w:document>`)},
    ...files]);
}

        close(); toast('Set-up loaded'+note+'. Reloading…'); setTimeout(()=>location.reload(), 1800); }; });
};
const mdLite=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split(/\r?\n/).map(l=>/^#{1,3} /.test(l)?`<h3 style="margin:14px 0 6px;font-size:14px">${l.replace(/^#+ /,'')}</h3>`:/^[-*] /.test(l)?`<li>${l.slice(2)}</li>`:l.trim()?`<p style="margin:6px 0">${l}</p>`:'').join('').replace(/(?:<li>.*?<\/li>)+/g,m=>`<ul style="margin:6px 0 6px 18px;padding:0">${m}</ul>`);
window.__folioWhatsNew=async(v)=>{
  const T=window.__TAURI__; if(!T||!T.app){ toast('This is part of the Folio desktop app'); return; }
  v=v||await T.app.getVersion(); let body='';
  try{ const r=await fetch(`https://api.github.com/repos/bretth212/folio-releases/releases/tags/v${v}`,{cache:'no-store'}); if(r.ok) body=(await r.json()).body||''; }catch(e){}
  body=body.replace(/Install with the \.msi below, or let Folio update itself\.?/,'').trim();
  await modal(`<h2>What's new in Folio ${esc(v)}</h2><div style="max-height:60vh;overflow:auto;font-size:13.5px;line-height:1.5">${body?mdLite(body):'<p>Improvements and fixes.</p>'}</div><div class="foot"><button class="btn pri" data-c>Got it</button></div>`,
    (m,close)=>{ m.querySelector('[data-c]').onclick=()=>close(); });
};
(async()=>{ const T=window.__TAURI__; if(!T||!T.app) return;
  try{ const v=await T.app.getVersion(); const last=store.get('lastVersion',null); store.set('lastVersion',v); if(last && last!==v) setTimeout(()=>window.__folioWhatsNew(v), 3000); }catch(e){} })();
if('launchQueue' in window){
  window.launchQueue.setConsumer(async params=>{
    if(!params.files || !params.files.length) return;
    if(params.folioAction && window.__folioAction){ window.__folioAction(params.folioAction, params.files); return; }
    for(const h of params.files){ try{ await openFile(await h.getFile(), h); }catch(e){ console.error(e); toast('Could not open '+(h.name||'that file')); } }
  });
}
// Shared to Folio from another app (Android share sheet)
(async()=>{
  const q=new URLSearchParams(location.search); if(!q.has('shared')) return;
  history.replaceState(null,'',location.pathname);
  try{ const c=await caches.open('folio-share'); const r=await c.match('shared-file'); if(!r){ toast('The shared file did not arrive, please try again'); return; }
    const name=decodeURIComponent(r.headers.get('x-name')||'shared.pdf'); const bytes=new Uint8Array(await r.arrayBuffer()); await c.delete('shared-file');
    await openBytes(bytes, name); rememberRecent(name, bytes, null); }catch(e){ console.error(e); }
})();
// Offline support + updates
if(BUILD==='app' && !window.__FOLIO_DESKTOP__ && 'serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW', e)); });
  let reloading=false, hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!hadController){ hadController=true; return; } if(reloading) return;
    toast('A new version of Folio is ready','Reload', ()=>{ reloading=true; location.reload(); }); });
}
})();
</script>

<script>(()=>{ const el=document.getElementById('fname'); if(!el) return; const c=document.createElement('canvas').getContext('2d');
  const fit=()=>{ const cs=getComputedStyle(el); c.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily; const w=c.measureText(el.value||el.placeholder||'').width+18; el.style.width=Math.ceil(w)+'px'; };
  const d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  Object.defineProperty(el,'value',{configurable:true, get(){ return d.get.call(el); }, set(v){ d.set.call(el,v); fit(); }});
  el.addEventListener('input',fit); window.addEventListener('resize',fit); (document.fonts&&document.fonts.ready||Promise.resolve()).then(fit); fit(); })();</script>
