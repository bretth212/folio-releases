<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00557d">
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-256.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>@media (max-width:760px){#bPanel{display:none!important}}</style>
<link href="fonts/fonts.css" rel="stylesheet">
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf.worker.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<style>
:root{
  --bg:#eceef2; --panel:#ffffff; --line:#e3e6ec; --line2:#d5d9e1; --ink:#1b1f29; --ink2:#5b6475; --ink3:#8a93a5;
  --accent:#00557d; --accent-soft:#e3f0f6; --danger:#d93a3a; --radius:10px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;touch-action:pan-x pan-y;overscroll-behavior:none;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em;margin-right:6px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.fname{min-width:170px;max-width:min(460px,36vw);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);font-weight:500;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:none}
.fname:hover{border-color:var(--line)} .fname:focus{outline:none;border-color:var(--accent);color:var(--ink)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f2f4f7}
.btn:disabled{opacity:.4;cursor:default;background:none}
.btn.out{border-color:var(--line2);background:#fff}
.btn.out:hover{background:#f7f8fa}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.ib{width:32px;padding:0;justify-content:center}
.grp{display:flex;align-items:center;gap:2px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.nav input{width:42px;height:28px;text-align:center;border:1px solid var(--line2);border-radius:6px;font:inherit}
.nav span{color:var(--ink3);margin:0 4px}
.zoomv{min-width:50px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink2);cursor:pointer;border-radius:6px;padding:6px 2px}
.zoomv:hover{background:#f2f4f7}
.search{display:flex;align-items:center;gap:4px;height:32px;border:1px solid var(--line2);border-radius:8px;padding:0 4px 0 8px;background:#fff;color:var(--ink3)}
.search input{border:none;outline:none;font:inherit;width:150px;color:var(--ink)}
.search .cnt{font-size:11px;min-width:34px;text-align:right;color:var(--ink3);font-variant-numeric:tabular-nums}
.search .btn{height:24px;width:24px}
.search:focus-within{border-color:var(--accent)}

/* tool bar */
.tools{display:flex;align-items:center;gap:2px;height:48px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:56px;height:42px;padding:0 6px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--ink2);font-size:10.5px;font-weight:500}
.tool:hover{background:#f2f4f7;color:var(--ink)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool:disabled{opacity:.35;cursor:default;background:none}

main{flex:1;display:flex;min-height:0}
#side{width:184px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px 0;flex:none}
#side.hide{display:none}
.thumb{position:relative;margin:0 auto 14px;width:124px;cursor:pointer;text-align:center}
.thumb .tb{position:relative;background:#fff;border:1px solid var(--line2);border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;min-height:60px}
.thumb img{display:block;width:100%}
.thumb.cur .tb{outline:2.5px solid var(--accent);outline-offset:2px}
.thumb .n{font-size:11px;color:var(--ink3);margin-top:5px}
.shead{position:sticky;top:-12px;background:#fff;z-index:2;padding:0 10px 10px;margin:-12px 0 12px;border-bottom:1px solid var(--line)}
.shead .row1{display:flex;align-items:center;gap:2px;padding-top:10px;min-height:42px}
.shead .row1 b{font-size:12px;color:var(--ink2);flex:1}
.shead .btn{height:28px;padding:0 7px;font-size:12px;gap:4px}
.shead .btn.ib{width:28px;padding:0}
.shead .row2{display:flex;gap:4px}
.shead.sel{background:var(--accent-soft)} .shead.sel .row2 .btn{background:#fff}
.stabs{display:flex;gap:2px;padding-top:10px}
.stabs button{flex:1 1 auto;min-width:0;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--ink3);padding:6px 2px;border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.stabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.stabs button[data-st=files]{flex:0 0 34px}
.stabs .cnt{background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:0 5px;font-size:10.5px;line-height:16px}
.shead .stabs + .row1{min-height:36px;padding-top:4px}
.bmtools{display:flex;gap:4px;padding-top:6px}
.bms{padding:0 6px 20px}
.bm{display:flex;align-items:center;gap:2px;min-height:30px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--ink);padding-right:4px;position:relative}
.bm:hover{background:var(--bg2,#f1f5f9)}
.bm.cur{background:var(--accent-soft)}
.bm .tw{width:18px;height:22px;flex:none;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--ink3);cursor:pointer;border-radius:4px}
.bm button.tw:hover{background:#e2e8f0}
.bm .bt{flex:1;min-width:0;line-height:1.3;margin:5px 0;max-height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.bm .bp{font-size:11px;color:var(--ink3);flex:none;padding-left:4px}
.bm.dead{color:var(--ink3)} .bm.dead .bt{text-decoration:line-through}
.bm .ba{display:none;position:absolute;right:2px;top:50%;transform:translateY(-50%);background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.bm:hover .ba{display:flex}
.bm .ba button{border:0;background:none;width:24px;height:24px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);border-radius:5px}
.bm .ba button:hover{background:var(--accent-soft);color:var(--accent)} .bm .ba button.del:hover{background:#fee2e2;color:#b91c1c}
.bmempty{padding:6px 14px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.bmempty .btn{margin:10px 0 8px;width:100%;justify-content:center}
.bmempty small{display:block;color:var(--ink3)}
@media (hover:none){ .bm .ba{display:flex;position:static;transform:none;box-shadow:none;background:none} }
svg.ov .lnkhov{fill:rgba(0,85,125,.10);stroke:rgba(0,85,125,.45);pointer-events:none}
.thumb .pick{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;display:none;place-items:center;padding:0;cursor:pointer;color:transparent;z-index:1}
.thumb:hover .pick,#side.picking .thumb .pick{display:grid}
.thumb.picked .pick{background:var(--accent);border-color:var(--accent);color:#fff}
.thumb.picked .tb{outline:2.5px solid var(--accent);outline-offset:2px;opacity:.92}
@media (hover:none){ .thumb .pick{display:grid} }
.opts{display:flex;flex-direction:column;gap:12px}
.opts .num{width:56px;padding:5px 6px;border:1px solid var(--line2);border-radius:6px;font:inherit;margin:0 4px}
.opts .dim{opacity:.45}
.thumb .acts{position:absolute;top:4px;right:4px;display:none;gap:3px}
.thumb:hover .acts{display:flex}
.thumb .acts button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.thumb .acts button svg{width:14px;height:14px}
.thumb .acts button:hover{color:var(--accent)}
.thumb .acts button.del:hover{color:var(--danger)}
.thumb.dropb::before,.thumb.dropa::after{content:"";position:absolute;left:-8px;right:-8px;height:3px;background:var(--accent);border-radius:2px}
.thumb.dropb::before{top:-9px}.thumb.dropa::after{bottom:-9px}
.thumb.dragging{opacity:.4}

#viewer{flex:1;overflow:auto;position:relative;outline:none}
#pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 24px 60px;min-width:min-content}
.page{position:relative;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.12),0 6px 20px rgba(16,24,40,.08);flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page .forms{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:2}
.fld{position:absolute;margin:0;border:none;border-bottom:1px solid rgba(0,85,125,.45);background:rgba(0,85,125,.09);color:#111;font-family:Helvetica,Arial,sans-serif;padding:0 2px;border-radius:1px;outline:none;line-height:1.15;resize:none}
.fld:hover{background:rgba(0,85,125,.15)}
.fld:focus{background:rgba(0,85,125,.06);box-shadow:0 0 0 1px var(--accent)}
.fld-check,.fld-radio{appearance:auto;accent-color:var(--accent);border:none;background:rgba(0,85,125,.09);padding:0}
textarea.fld{padding:1px 2px}
select.fld{padding:0}
.fld:disabled{background:transparent;border-bottom-color:transparent}
#viewer.t-select .fld,#viewer.t-edittext .fld{pointer-events:auto}
.tabbar{display:none;align-items:flex-end;gap:2px;height:38px;padding:6px 8px 0;background:#e4e7ec;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:thin}
.tabbar.show{display:flex}
.tab{display:flex;align-items:center;gap:7px;height:32px;min-width:120px;max-width:230px;padding:0 6px 0 11px;border-radius:9px 9px 0 0;background:transparent;color:var(--ink2);cursor:pointer;user-select:none;flex:0 1 auto;position:relative;font-size:12.5px}
.tab:hover{background:rgba(255,255,255,.55)}
.tab.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 -1px 0 var(--line) inset}
.tab .ti{color:var(--accent);display:flex}
.tab .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.tab .tx{width:22px;height:22px;border-radius:6px;border:none;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink3);padding:0;flex:none}
.tab .tx:hover{background:rgba(0,0,0,.08);color:var(--ink)}
.tab.dragging{opacity:.45}
.tab.dropb::before{content:"";position:absolute;left:-2px;top:6px;bottom:4px;width:3px;border-radius:2px;background:var(--accent)}
.tab.dropa::after{content:"";position:absolute;right:-2px;top:6px;bottom:4px;width:3px;border-radius:2px;background:var(--accent)}
.tabbar.dropin{background:#d5e6ee}
.thome{display:grid;place-items:center;width:40px;height:32px;margin-right:4px;border:none;border-radius:9px 9px 0 0;background:transparent;color:var(--ink2);cursor:pointer;flex:none}
.thome:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.thome.on{background:var(--panel);color:var(--accent);box-shadow:0 -1px 0 var(--line) inset}
.tadd{width:30px;height:28px;margin:0 0 2px 2px;border:none;border-radius:8px;background:none;cursor:pointer;color:var(--ink2);display:grid;place-items:center;flex:none}
.tadd:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.split{display:flex}
.split #bSave{border-radius:8px 0 0 8px}
.split .caret{border-radius:0 8px 8px 0;width:28px;padding:0;justify-content:center;border-left:1px solid rgba(255,255,255,.35)}
.menu{position:fixed;z-index:80;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.18);padding:5px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:none;background:none;border-radius:7px;cursor:pointer;text-align:left;font-size:13px;color:var(--ink)}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:var(--accent-soft);outline:none}
.menu button:disabled{opacity:.4;cursor:default}
.menu button .k{margin-left:auto;color:var(--ink3);font-size:11.5px}
.menu button svg{color:var(--ink2)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 4px}
.menu{max-height:calc(100vh - 12px);overflow:auto}
.menu .mh{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:8px 10px 3px}
.menu .mh:first-child{padding-top:4px}
.ftypes{display:flex;flex-wrap:wrap;gap:5px}
.ftypes button{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.ftypes button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.mval{font-size:20px;font-weight:700;color:var(--accent);margin:2px 0 12px}
.favbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 14px;padding:8px;background:var(--accent-soft);border-radius:10px;font-size:12px}
.favbar .fl{display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;margin-right:2px}
.favbar .fv{background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:3px 8px 3px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.favbar .fv:hover{border-color:var(--accent);color:var(--accent)} .favbar .fv.team{border-style:dashed}
.favbar .fv i{font-style:normal;color:var(--ink3);padding:0 2px} .favbar .fv i:hover{color:#b91c1c}
.favbar .fsave{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;margin-left:auto}
.stamps button.fav{position:relative} .stamps button i{font-style:normal;position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--panel);border:1px solid var(--line2);color:var(--ink3);font-size:11px;line-height:14px;display:none}
.stamps button:hover i{display:block}
.tprev{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:12px 0}
.tprev table{border-collapse:collapse;font-size:12px;width:100%} .tprev td{border:1px solid var(--line);padding:3px 6px;min-width:40px;max-width:340px} .tprev td.n{white-space:nowrap} .tprev td.n{text-align:right;font-variant-numeric:tabular-nums}
.tprev tr:first-child td{background:var(--accent-soft);font-weight:600}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px} .kgrid h4{margin:0 0 6px;font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.kr{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px}
kbd{font:inherit;font-size:11.5px;background:var(--bg);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 6px;white-space:nowrap}
.bm.att .bt small{display:block;color:var(--ink3);font-size:11px}
@media (max-width:760px){ .kgrid{grid-template-columns:1fr} }
/* dark mode: the pages stay white, everything around them goes dark */
html[data-theme=dark]{--bg:#121519; --panel:#1c2027; --line:#2a3039; --line2:#39414d; --ink:#e7eaf0; --ink2:#aab3c1; --ink3:#7f8999; --accent:#4ba3d3; --accent-soft:#1a3242; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35); color-scheme:dark}
html[data-theme=dark] .btn:hover{background:#262c35} html[data-theme=dark] .btn.out{background:var(--panel)} html[data-theme=dark] .btn.out:hover{background:#262c35}
html[data-theme=dark] .btn.pri{background:#0b6a98;border-color:#0b6a98}
html[data-theme=dark] .menu,html[data-theme=dark] .modal,html[data-theme=dark] .toast{background:var(--panel);color:var(--ink)}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:#15191f;color:var(--ink);border-color:var(--line2)}
html[data-theme=dark] .bm:hover,html[data-theme=dark] #recent .ri:hover{background:#252b34}
html[data-theme=dark] .bm .ba{background:var(--panel)}
html[data-theme=dark] .ritem{background:var(--panel)}
html[data-theme=dark] .page{box-shadow:0 2px 12px rgba(0,0,0,.6)}
html[data-theme=dark] .zoomv:hover,html[data-theme=dark] .tool:hover{background:#262c35}
html[data-theme=dark] .shead,html[data-theme=dark] .card,html[data-theme=dark] .seg button,html[data-theme=dark] .citem,html[data-theme=dark] .inp,html[data-theme=dark] .fonts button,html[data-theme=dark] .sheet-head,html[data-theme=dark] .thumb .acts button,html[data-theme=dark] .sigcard .del{background:var(--panel);color:var(--ink)}
html[data-theme=dark] .stamps button{background:#f4f5f7}
html[data-theme=dark] .citem .crep{background:#232831}
html[data-theme=dark] .warnbox{background:#3a2220;border-color:#6b2f28}
html[data-theme=dark] .bm button.tw:hover{background:#2c333d}
html[data-theme=dark] .tabbar{background:#0e1114}
html[data-theme=dark] .tab:hover{background:rgba(255,255,255,.06)} html[data-theme=dark] .tab .tx:hover{background:rgba(255,255,255,.1)}
html[data-theme=dark] .scanview{background:#0b0d10}
html[data-theme=dark] #panel select,html[data-theme=dark] #panel textarea,html[data-theme=dark] #panel input{background:#15191f;color:var(--ink)}
@media (max-width:760px){ .tab{min-width:96px;max-width:160px} .tabbar{height:36px} }
@media (hover:none){ .menu button .k{display:none} }
.page svg.ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.page .ed{position:absolute;margin:0;padding:0;border:none;outline:1.5px dashed var(--accent);outline-offset:2px;background:rgba(255,255,255,.0);resize:none;overflow:hidden;white-space:pre;line-height:1.2;z-index:3}
#viewer.t-select svg.ov{cursor:default}
#viewer.t-select svg.ov [data-id]{cursor:move}
#viewer.t-text svg.ov,#viewer.t-edittext svg.ov{cursor:text}
#viewer.t-highlight svg.ov,#viewer.t-whiteout svg.ov,#viewer.t-rect svg.ov,#viewer.t-ellipse svg.ov,#viewer.t-line svg.ov,#viewer.t-arrow svg.ov,#viewer.t-ink svg.ov,#viewer.t-note svg.ov,#viewer.pending svg.ov{cursor:crosshair}
svg.ov .hl{mix-blend-mode:multiply}
svg.ov .hit{fill:#ffb703;opacity:.35;mix-blend-mode:multiply;pointer-events:none}
svg.ov .hit.cur{fill:#fb5607;opacity:.45}
svg.ov .selbox{fill:none;stroke:var(--accent);stroke-dasharray:4 3;pointer-events:none}
svg.ov .handle{fill:#fff;stroke:var(--accent);cursor:nwse-resize}
svg.ov .hover{fill:rgba(0,85,125,.08);stroke:var(--accent);stroke-dasharray:3 2;pointer-events:none}

/* empty state */
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:40px 44px;text-align:center;max-width:460px}
.card .big{width:64px;height:64px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 18px}
.card .big svg{width:30px;height:30px}
.card h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
.card p{color:var(--ink2);margin:0 0 22px;line-height:1.55}
.card .row{display:flex;gap:8px;justify-content:center}
.card .btn{height:38px;padding:0 16px}
.card small{display:block;margin-top:18px;color:var(--ink3)}
#recent:empty{display:none}
#recent{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;text-align:left}
#recent .rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#recent .rh b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600}
#recent .rh button{background:none;border:0;color:var(--ink3);font:inherit;font-size:12px;cursor:pointer;padding:2px 4px}
#recent .rh button:hover{color:var(--accent)}
#recent .restore{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:10px 12px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
#recent .restore small{display:block;margin:2px 0 0;font-weight:400;color:var(--ink2)}
#recent .ri{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;background:none;border-radius:8px;font:inherit;cursor:pointer;text-align:left;color:var(--ink)}
#recent .ri:hover{background:var(--bg2,#f1f5f9)}
#recent .ri svg{flex:none;color:var(--accent)}
#recent .ri span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#recent .ri em{font-style:normal;font-size:12px;color:var(--ink3);flex:none}
#recent .ri .x{opacity:0;padding:2px 4px;border-radius:4px;color:var(--ink3)}
#recent .ri:hover .x{opacity:1}
#recent .ri .x:hover{background:#fee2e2;color:#b91c1c}
.dropping #viewer::after{content:"Drop PDF or image";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:14px;background:rgba(0,85,125,.06);display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--accent);pointer-events:none}

/* right panel */
#panel{width:252px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;flex:none;padding:16px}
#panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:0 0 12px;font-weight:600}
#panel .f{margin-bottom:16px}
#panel label.l{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.sw input[type=color]{width:26px;height:26px;border:none;padding:0;background:none;cursor:pointer}
.rng{display:flex;align-items:center;gap:8px}
.rng input{flex:1;accent-color:var(--accent)}
.rng span{width:36px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
#panel select,#panel textarea,#panel input[type=number]{width:100%;font:inherit;border:1px solid var(--line2);border-radius:8px;padding:7px 8px;background:#fff}
#panel textarea{min-height:90px;resize:vertical}
.seg{display:flex;gap:4px;align-items:center}
.seg button{min-width:32px;height:32px;border:1px solid var(--line2);background:#fff;border-radius:8px;cursor:pointer;display:grid;place-items:center;font-size:14px;padding:0 8px}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg .gap{width:8px}
.seg.wide button{flex:1;font-size:12.5px;font-weight:500}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.ptabs button{flex:1;border:none;background:none;padding:9px 4px;cursor:pointer;color:var(--ink2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--accent);border-color:var(--accent)}
.ptabs .cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px}
.cfilter{margin-bottom:12px} .cname{margin-bottom:12px}
.clist{display:flex;flex-direction:column;gap:8px}
.citem{border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:#fff}
.citem:hover{border-color:var(--line2)} .citem.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.citem.res{opacity:.6}
.citem .ch{display:flex;align-items:center;gap:7px;font-size:12.5px}
.citem .cdot{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.citem .cpg{margin-left:auto;color:var(--ink3);font-size:11.5px}
.citem .cres{color:#15803d;font-size:11px;font-weight:600}
.citem .cq{margin-top:6px;padding-left:8px;border-left:3px solid var(--line2);color:var(--ink2);font-size:12.5px;line-height:1.45;word-break:break-word}
.citem .ctext{width:100%;margin-top:7px;font:inherit;font-size:12.5px;border:1px solid var(--line2);border-radius:7px;padding:6px 7px;resize:vertical;min-height:40px}
.citem .cmeta{color:var(--ink3);font-size:11.5px;margin-top:5px}
.citem .crep{margin:7px 0 0 10px;padding:6px 8px;background:#f6f7f9;border-radius:7px;font-size:12.5px}
.citem .creply{display:flex;gap:5px;margin-top:8px} .citem .creply .inp{padding:5px 7px;font-size:12.5px} .citem .creply .btn{height:30px;padding:0 9px;font-size:12px}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.stamps button{border:2px solid;border-radius:7px;background:#fff;font:700 10.5px Helvetica,Arial,sans-serif;padding:7px 4px;cursor:pointer;letter-spacing:.02em;opacity:.85}
.stamps button:hover{opacity:1} .stamps button.on{opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.inp{width:100%;font:inherit;border:1px solid var(--line2);border-radius:8px;padding:7px 8px;background:#fff}
.row2c{display:flex;gap:6px} .row2c .btn{height:34px}
.warnbox{background:#fff4f2;border:1px solid #f5c2bb;border-radius:10px;padding:10px 12px}
.warnbox b{display:block;color:#b42318;font-size:12.5px;margin-bottom:4px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.hint{color:var(--ink2);line-height:1.55;font-size:12.5px}
.hint kbd{font:inherit;font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fafbfc}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtns{display:flex;gap:6px;flex-wrap:wrap}
.pbtns .btn{height:30px}
.danger{color:var(--danger)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(16,20,30,.38);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:580px;padding:22px;max-height:calc(100dvh - 32px);overflow:auto}
.modal h2{margin:0 0 14px;font-size:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;min-height:120px;align-content:start}
.sigcard{position:relative;height:84px;border:1px solid var(--line2);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fcfcfd;padding:8px}
.sigcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.sigcard img{max-width:100%;max-height:100%}
.sigcard .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;opacity:0}
.sigcard:hover .del{opacity:1}
@media (hover:none){ .sigcard .del{opacity:1} }
.sigpad{width:100%;height:180px;border:1px dashed var(--line2);border-radius:10px;background:#fcfcfd;touch-action:none;display:block;cursor:crosshair}
.sigrow{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--ink2)}
.sigtype input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line2);border-radius:8px;font-family:inherit}
.sigprev{height:120px;border:1px dashed var(--line2);border-radius:10px;margin-top:10px;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;white-space:nowrap}
.fonts{display:flex;gap:6px;margin-top:10px}
.fonts button{flex:1;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:6px;font-size:20px;cursor:pointer}
.fonts button.on{border-color:var(--accent);background:var(--accent-soft)}
.pw input{width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;font:inherit}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1b1f29;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;z-index:60;display:flex;gap:12px;align-items:center;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:none;border:none;color:#8fd0ee;font-weight:600;cursor:pointer;padding:0}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:70;font-weight:600;color:var(--ink2)}
.busy.show{display:flex}
.spin{width:22px;height:22px;border:3px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}

.only-sm,.sheet-head{display:none}
#viewer{touch-action:pan-x pan-y}
@media (hover:none){ .thumb .acts{display:flex} }

/* tablets & phones: properties become a bottom sheet */
@media (max-width:1100px){
  #panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:52vh;z-index:40;border-left:none;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(16,24,40,.18);padding:0 16px 16px;transform:translateY(105%);transition:transform .22s ease;
    padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  #panel.open{transform:none}
  .sheet-head{display:flex;align-items:center;position:sticky;top:0;background:#fff;padding:10px 0 8px;margin-bottom:6px;z-index:1}
  .sheet-head::before{content:"";position:absolute;left:50%;top:5px;width:36px;height:4px;border-radius:2px;background:var(--line2);transform:translateX(-50%)}
  .sheet-head b{flex:1;font-size:14px;margin-top:6px}
  .sheet-head .btn{margin-top:6px}
  .only-sm{display:flex}
  .sheet-head + h3{display:none}
}
/* phones */
@media (max-width:760px){
  .top{height:50px;padding:0 6px;gap:2px}
  .brand{margin-right:2px;font-size:0;gap:0}
  .fname,.hide-sm{display:none!important}
  .sep{margin:0 2px}
  .search{display:none;position:absolute;left:8px;right:8px;top:56px;z-index:30;height:40px;box-shadow:var(--shadow)}
  .search input{flex:1;width:auto;font-size:16px}
  body.searching .search{display:flex}
  #bOpen,#bSave{padding:0 9px}
  #bSave .lbl{display:none}
  .tools{height:52px;padding:0 4px}
  .tool{min-width:54px;height:46px;font-size:10px}
  #side{display:block;position:fixed;top:0;bottom:0;left:0;z-index:45;width:170px;transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 30px rgba(0,0,0,.15);padding-top:16px}
  #side.show{transform:none}
  #side.hide{display:block}
  .scrim{position:fixed;inset:0;background:rgba(16,20,30,.3);z-index:44;display:none}
  .scrim.show{display:block}
  #pages{padding:12px 10px 120px;gap:12px}
  .card{padding:28px 22px}
  .card .row{flex-direction:column}
  .zoomv{min-width:42px;font-size:12px}
  .btn.ib{width:30px}
  .modal{padding:18px}
  .sigpad{height:160px}
}
@media (min-width:761px){ #bSearch{display:none} }

.tools{height:auto;min-height:48px;padding-top:3px;padding-bottom:3px;scrollbar-width:thin}
.tools::-webkit-scrollbar{height:6px}
.tools::-webkit-scrollbar-thumb{background:#c5cad3;border-radius:3px}
.tool{flex:0 0 auto;height:auto;min-height:42px;padding:3px 6px}
.tool span{white-space:nowrap;line-height:1.25}
body:has(.modal-bg) #busy{display:none!important}
.stabs button{white-space:nowrap;flex:1 1 auto;min-width:max-content;padding:6px 6px}
.stabs button[data-st=files]{flex:0 0 34px;min-width:34px}
@media (min-width:761px){
  #side{width:var(--side-w,220px)}
  #panel{width:var(--panel-w,252px)}
  body.nopanel #panel,body.nopanel .fgrip-panel,#side.hide + .fgrip-side{display:none}
  .fgrip{flex:none;width:6px;margin:0 -3px;position:relative;z-index:6;cursor:col-resize;background:transparent;transition:background .15s}
  .fgrip:hover,body.fresizing .fgrip{background:var(--accent-soft)}
  body.fresizing{cursor:col-resize;user-select:none}
  body.fresizing #viewer{pointer-events:none}
}
@media (max-width:760px){.fgrip{display:none}}
#bSide.on,#bPanel.on{color:var(--accent)}
</style>

<body>
<div id="app">
  <header class="top">
    <div class="brand"><div class="logo" id="lg"></div>Folio</div>
    <input class="fname" id="fname" value="" placeholder="Untitled.pdf" spellcheck="false" title="File name. Change it and save to rename the file">
    <div class="sp"></div>
    <div class="grp">
      <button class="btn ib" id="bSide" title="Toggle page thumbnails"></button>

      <button class="btn ib" id="bRedo" title="Redo (Ctrl+Shift+Z)"></button>
    </div>
    <div class="sep hide-sm"></div>
    <div class="grp nav hide-sm">
      <button class="btn ib" id="bPrev" title="Previous page"></button>
      <input id="pgIn" value="0" inputmode="numeric"><span id="pgN">/ 0</span>
      <button class="btn ib" id="bNext" title="Next page"></button>
    </div>
    <div class="sep hide-sm"></div>

      <button class="btn ib hide-sm" id="bFit" title="Fit width"></button>
    </div>
    <div class="sep"></div>
    <button class="btn ib" id="bSearch" title="Find in document"></button>
    <div class="search" id="srch"><span id="sIc"></span><input id="sIn" placeholder="Find in document"><span class="cnt" id="sCnt"></span><button class="btn ib" id="sPrev" title="Previous match"></button><button class="btn ib" id="sNext" title="Next match"></button></div>
    <div class="sep"></div>
    <button class="btn out hide-sm" id="bCompiler" style="display:none" title="Report &amp; datasheet compilers" onclick="window.__TAURI__&&window.__TAURI__.core.invoke('open_compiler')"><svg class="i" viewBox="0 0 24 24"><path d="M7 3h8l4 4v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M3 8v11a2 2 0 0 0 2 2h10"/><path d="M9 9h6M9 13h6"/></svg><span>Compiler</span></button>
    <button class="btn out" id="bOpen"><span id="oIc"></span><span class="hide-sm">Open</span></button>
    <button class="btn ib hide-sm" id="bPrint" title="Print (Ctrl+P)"></button>
    <div class="split" id="saveGrp"><button class="btn pri" id="bSave" title="Save (Ctrl+S)"><span id="dIc"></span><span class="lbl">Save</span></button><button class="btn pri caret" id="bSaveMenu" title="More save options" aria-haspopup="menu"></button></div>
  </header>
  <div class="tabbar" id="tabbar" role="tablist"></div>
  <nav class="tools" id="tools"></nav>
  <main>
    <aside id="side"></aside>
    <section id="viewer" tabindex="-1">
      <div id="pages"></div>
      <div id="empty">
        <div class="card">
          <div class="big" id="emIc"></div>
          <h1>Open a PDF to read and edit</h1>
          <p>Annotate, highlight, edit existing text, fill and sign forms, rearrange pages and merge files. Everything runs in your browser; your files aren't uploaded anywhere.</p>
          <div class="row"><button class="btn pri" id="eOpen">Open PDF</button><button class="btn out" id="eSample">Try a sample</button></div>
          <small>or drop a PDF anywhere on this page</small>
          <div id="recent"></div>
        </div>
      </div>
    </section>
    <aside id="panel"></aside>
  </main>
</div>
<input type="file" id="fOpen" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="fMerge" accept="application/pdf,.pdf" hidden>
<input type="file" id="fImg" accept="image/*" hidden>

function modal(html, onMount){

    const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal">${html}</div>`;
    document.body.appendChild(bg);
    const close = v => { bg.remove(); res(v); };
    bg.addEventListener('pointerdown', e=>{ if(e.target===bg) close(null); });
    bg.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') close(null); });
    onMount(bg.firstChild, close);
  });
}

async function loadSource(bytes, name){

  let enc=false, usedPw='';
  task.onPassword = (update, reason) => { enc=true;
    askPassword(reason===pdfjsLib.PasswordResponses.INCORRECT_PASSWORD).then(pw=>{ if(pw==null) task.destroy(); else { usedPw=pw; update(pw); } }); };
  const doc = await task.promise;
  const sid = nid('s'); S.sources[sid] = {bytes, doc, name, enc};
  await prepareEncrypted(sid, usedPw);
  const pages=[];
  for(let i=0;i<doc.numPages;i++){
    const pg = await doc.getPage(i+1); const v = pg.view;
    pages.push({id:nid('p'), src:sid, idx:i, rot:((pg.rotate%360)+360)%360, w0:v[2]-v[0], h0:v[3]-v[1], vx0:v[0], vy0:v[1], annots:[]});

}

/* ---------- Find & redact ---------- */
const FR_PATTERNS={
  email:{label:'Email addresses', re:/[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+/g},
  // starts with + or 0 and has 9 to 13 digits, so VAT and order numbers aren't caught
  phone:{label:'Phone numbers', re:/\+?\(?\d[\d\s().-]{7,}\d/g, ok:t=>/^(\+|\(?0)/.test(t) && (t.match(/\d/g)||[]).length>=9 && (t.match(/\d/g)||[]).length<=13},
  postcode:{label:'UK postcodes', re:/\b[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}\b/gi},
};
async function findMatches(q, opts){
  const res=[]; const res_=[];
  if(q){ let src=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+'); if(opts.word) src=`(?<![A-Za-z0-9])${src}(?![A-Za-z0-9])`; res_.push(new RegExp(src, opts.cs?'g':'gi')); }
  for(const k of Object.keys(FR_PATTERNS)) if(opts[k]){ const re=new RegExp(FR_PATTERNS[k].re.source, FR_PATTERNS[k].re.flags); re.ok=FR_PATTERNS[k].ok; res_.push(re); }
  let noText=0;
  for(let pi=0; pi<S.pages.length; pi++){ const p=S.pages[pi]; const runs=await getRuns(p); if(!runs.length){ noText++; continue; }
    for(const r of runs){ const xs=caretXs(r);
      for(const re of res_){ re.lastIndex=0; let m; while((m=re.exec(r.str))){ if(!m[0].trim()){ re.lastIndex++; continue; } if(re.ok && !re.ok(m[0].trim())) continue;
        const a=m.index, b=a+m[0].replace(/\s+$/,'').length; res.push({pi, p, x:xs[a]-0.8, w:xs[b]-xs[a]+1.6, y:r.y-0.5, h:r.h+1, text:m[0], ctx:r.str, at:a}); } } } }
  // the same words found by two searches only need one box
  const seen=new Set(); return {list:res.filter(m=>{ const k=m.p.id+':'+Math.round(m.x)+':'+Math.round(m.y); if(seen.has(k)) return false; seen.add(k); return true; }), noText};
}

/* ---------- Build a report from several files ---------- */
async function imageToPdfBytes(file){
  const bmp=await createImageBitmap(file); const cv=document.createElement('canvas'); const sc=Math.min(1, 2400/Math.max(bmp.width,bmp.height));
  cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc); const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height); c.drawImage(bmp,0,0,cv.width,cv.height); bmp.close&&bmp.close();
  const jpg=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88)); return imagesToPdf([{bytes:new Uint8Array(await jpg.arrayBuffer()), w:cv.width, h:cv.height}], true);
}
// Images as PDF pages: A4, turned to suit the picture, with a small margin (or filling the page for scans)
async function imagesToPdf(imgs, margin){
  const d=await PDFDocument.create();
  for(const im of imgs){ const land=im.w>im.h; const [PW,PH]=land?[841.89,595.28]:[595.28,841.89]; const mg=margin?24:0;
    const sc=Math.min((PW-2*mg)/im.w, (PH-2*mg)/im.h); const w=im.w*sc, h=im.h*sc; const pg=d.addPage([PW,PH]);
    const e=await d.embedJpg(im.bytes); pg.drawImage(e,{x:(PW-w)/2, y:(PH-h)/2, width:w, height:h}); }
  return await d.save();
}
async function makeContentsPdf(title, rows){

        else if(t.dataset.s!=null){ cur=+t.dataset.s; show(); }
        else if(t.hasAttribute('data-rot')){ sh.rot=((sh.rot||0)+90)%360; toast(`This page will be turned ${sh.rot}°`); }
        else if(t.hasAttribute('data-full')){ sh.quad=[[0,0],[sh.cv.width,0],[sh.cv.width,sh.cv.height],[0,sh.cv.height]]; drawQuad(); }
        else if(t.hasAttribute('data-auto')){ sh.quad=detectQuad(sh.cv); drawQuad(); }
        else if(t.hasAttribute('data-del')){ if(shots.length>1){ shots.splice(cur,1); cur=Math.min(cur,shots.length-1); show(); } }
        else if(t.hasAttribute('data-more')){ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.multiple=true; if(narrow()) i.setAttribute('capture','environment');
          i.onchange=async()=>{ for(const f of i.files){ try{ shots.push(await loadShot(f)); }catch(_){} } cur=shots.length-1; show(); }; i.click(); }
        else if(t.hasAttribute('data-c')) close(null);
        else if(t.hasAttribute('data-ok')) close({into: !!(m.querySelector('[data-into]')||{}).checked});
      });
      requestAnimationFrame(show); });
  if(!res) return;
  busy(true,'Making the PDF…');
  try{
    const imgs=[]; for(let i=0;i<shots.length;i++){ busy(true,`Straightening page ${i+1} of ${shots.length}…`); await new Promise(r=>setTimeout(r,20));
      const c=processShot(shots[i]); const b=await new Promise(r=>c.toBlob(r,'image/jpeg', shots[i].mode==='colour'?0.85:0.8)); imgs.push({bytes:new Uint8Array(await b.arrayBuffer()), w:c.width, h:c.height}); }
    const bytes=await imagesToPdf(imgs, false);
    const name=`Scan ${new Date().toISOString().slice(0,16).replace('T',' ').replace(':','.')}.pdf`;
    if(res.into && S.pages.length){ const b=snap(); const pages=await loadSource(bytes, name); active.srcs.add(pages[0].src); const at=S.cur+1;
      S.pages.splice(at,0,...pages); commit(b); layout(); renderAllOverlays(); busy(false); setTimeout(()=>gotoPage(at),50);
      toast(`Added ${pages.length} scanned page${pages.length>1?'s':''}`,'Recognise text', ocrDialog); }
    else { busy(false); await openBytes(bytes, name); S.savedSnap=''; renderTabs(); toast(`Scan ready: ${imgs.length} page${imgs.length>1?'s':''}. Make the text searchable?`,'Recognise text', ocrDialog); }
  }catch(e){ console.error(e); busy(false); toast('Could not make the PDF: '+(e.message||e)); }
}

/* ---------- Bookmarks (the PDF's outline) and links ---------- */
// Where a PDF destination points: the page (index in its own file) and the top of the view, in PDF units
async function resolveDest(doc, dest){
  try{
    if(typeof dest==='string') dest=await doc.getDestination(dest);
    if(!Array.isArray(dest) || !dest.length) return null;
    const r=dest[0]; let idx;
    if(r && typeof r==='object') idx=await doc.getPageIndex(r); else if(Number.isInteger(r)) idx=r; else return null;
    const kind=dest[1] && dest[1].name; let left=null, top=null;
    if(kind==='XYZ'){ left=dest[2]; top=dest[3]; } else if(kind==='FitH'||kind==='FitBH'){ top=dest[2]; } else if(kind==='FitR'){ left=dest[2]; top=dest[5]; }
    return {idx, left:typeof left==='number'?left:null, top:typeof top==='number'?top:null};
  }catch(e){ return null; }
}
// PDF user space -> page coordinates (the reverse of toPdf)
function fromPdf(p, x, y){
  const x0=p.vx0, y0=p.vy0, x1=x0+p.w0, y1=y0+p.h0;
  switch(p.rot){ case 90: return [y-y0, x-x0]; case 180: return [x1-x, y-y0]; case 270: return [y1-y, x1-x]; default: return [x-x0, y1-y]; }
}
const destY = (q, left, top) => top==null ? null : Math.max(0, Math.min(dims(q)[1], fromPdf(q, left??q.vx0, top)[1]));
async function readOutline(sid, pages){
  const doc=S.sources[sid].doc; let items; try{ items=await doc.getOutline(); }catch(e){ return null; }
  if(!items || !items.length) return null;
  let n=0;
  const conv=async (it, depth)=>{
    if(++n>5000 || depth>16) return null;
    const node={id:nid('b'), title:String(it.title||'').replace(/\s+/g,' ').trim()||'Untitled', kids:[]};
    if(it.count>0) node.startOpen=true;
    if(it.url) node.url=it.url;
    else if(it.dest){ const d=await resolveDest(doc, it.dest); const q=d&&pages[d.idx]; if(q){ node.pid=q.id; node.y=destY(q, d.left, d.top); } }
    for(const k of it.items||[]){ const c=await conv(k, depth+1); if(c) node.kids.push(c); }
    return node;
  };
  const out=[]; for(const it of items){ const c=await conv(it,0); if(c) out.push(c); }
  return out.length ? out : null;
}
function openByDefault(ol){ const ids=[]; const walk=(ns,d)=>{ for(const n of ns||[]){ if(n.kids.length && (n.startOpen || d===0 && (ol.length<=12))) ids.push(n.id); walk(n.kids,d+1); } }; walk(ol,0); return ids; }
function findBm(id, list=S.outline||[], parent=null){ for(let i=0;i<list.length;i++){ const n=list[i]; if(n.id===id) return {n, list, i, parent}; const r=findBm(id, n.kids, n); if(r) return r; } return null; }
const walkBm = (fn, list=S.outline||[]) => { for(const n of list){ fn(n); walkBm(fn, n.kids); } };

// Links on a page: the PDF's own (to a page, or a web address) plus, on a contents page with none, its entries
const linkCache={};
async function getLinks(p){
  if(!p.src) return [];
  const k=`${p.src}:${p.idx}:${p.rot}`; if(linkCache[k]) return linkCache[k];
  const out=[];
  try{
    const doc=S.sources[p.src].doc; const pg=await doc.getPage(p.idx+1);
    for(const a of await pg.getAnnotations({intent:'display'})){
      if(a.subtype!=='Link' || !a.rect) continue;
      const c1=fromPdf(p,a.rect[0],a.rect[1]), c2=fromPdf(p,a.rect[2],a.rect[3]);
      const L={x:Math.min(c1[0],c2[0]), y:Math.min(c1[1],c2[1]), w:Math.abs(c2[0]-c1[0]), h:Math.abs(c2[1]-c1[1]), rect:[...a.rect]};
      if(L.w<1||L.h<1) continue;
      if(a.url) L.url=a.url;
      else if(a.dest){ const d=await resolveDest(doc,a.dest); if(!d) continue; L.to={src:p.src, idx:d.idx, left:d.left, top:d.top}; }
      else if(['NextPage','PrevPage','FirstPage','LastPage'].includes(a.action)) L.action=a.action;
      else continue;
      out.push(L);
    }
  }catch(e){ console.warn('links', e); }
  if(!out.some(l=>l.to)){ try{ for(const e of await tocEntries(p)) out.push({x:e.x, y:e.y, w:e.w, h:e.h, toc:e}); }catch(e){ console.warn('contents', e); } }
  linkCache[k]=out;
  // the pointer may already be over a link that has just been found
  return out;
}
const inBox = (r, pt, pad=1) => pt.x>=r.x-pad && pt.x<=r.x+r.w+pad && pt.y>=r.y-pad && pt.y<=r.y+r.h+pad;
function linkAt(p, pt){
  const own=(p.links||[]).find(l=>inBox(l,pt)); if(own) return own;
  const arr=p.src && linkCache[`${p.src}:${p.idx}:${p.rot}`]; if(!arr) return null;
  // the smallest box wins when links overlap
  let best=null; for(const l of arr){ if(l.toc && (p.links||[]).length) continue; if(inBox(l,pt) && (!best || l.w*l.h<best.w*best.h)) best=l; }
  return best;
}
function linkLabel(p, L){
  if(L.url) return L.url;
  if(L.toc) return 'Go to '+L.toc.title;
  if(L.action) return {NextPage:'Next page', PrevPage:'Previous page', FirstPage:'First page', LastPage:'Last page'}[L.action];
  const q = typeof L.to==='string' ? pageById(L.to) : S.pages.find(x=>x.src===L.to.src && x.idx===L.to.idx);
  return q ? 'Go to page '+(S.pages.indexOf(q)+1) : 'Link to a page that is no longer in this document';
}
let linkHov=null;
function hoverLink(e){
  let next=null, pel=null, p=null;
  if(S.tool==='select' && !S.pending){
    const ov=e.target.closest && e.target.closest('svg.ov');
    if(ov && !e.target.closest('[data-id],[data-handle]')){ pel=ov.parentElement; p=pageById(pel.dataset.pid);
      const L=p && linkAt(p, ptIn(e,pel)); if(L) next={pid:p.id, x:L.x, y:L.y, w:L.w, h:L.h, L}; }
  }
  if(linkHov && next && linkHov.pid===next.pid && linkHov.L===next.L) return;
  const prev=linkHov; linkHov=next;
  if(prev){ const q=pageById(prev.pid), el=q&&pageEl(q.id); if(q) renderOverlay(q); if(el){ el.querySelector('svg.ov').style.cursor=''; el.title=''; } }
  if(next){ renderOverlay(p); pel.querySelector('svg.ov').style.cursor='pointer'; pel.title=linkLabel(p, next.L); }
}
const backStack=[];
function goDest(q, y, fromLink){
  const el=q && pageEl(q.id); if(!el) return;
  backStack.push(viewer.scrollTop); if(backStack.length>50) backStack.shift();
  viewer.scrollTop = el.offsetTop + (y!=null ? Math.max(0, y*S.zoom - 14) : -16);
  S.cur=S.pages.indexOf(q); updNav(); markThumb();
  if(fromLink) toast(`Page ${S.cur+1}`, 'Back', goBack);
}
function goBack(){ if(backStack.length) viewer.scrollTop=backStack.pop(); }
async function openUrl(url){
  const ok=await modal(`<h2>Open this link?</h2><div class="hint" style="word-break:break-all;margin-bottom:14px">${esc(url)}</div><div class="foot"><button class="btn out" data-c>Cancel</button><button class="btn pri" data-o>Open link</button></div>`,
    (m,close)=>{ m.querySelector('[data-c]').onclick=()=>close(false); m.querySelector('[data-o]').onclick=()=>close(true); m.querySelector('[data-o]').focus(); });
  if(ok) window.open(url, '_blank', 'noopener');
}
async function followLink(p, L){
  if(L.url){ openUrl(L.url); return; }
  if(L.action){ const i=S.pages.indexOf(p); const j={NextPage:i+1, PrevPage:i-1, FirstPage:0, LastPage:S.pages.length-1}[L.action]; if(j>=0 && j<S.pages.length) goDest(S.pages[j], null, true); return; }
  if(typeof L.to==='string'){ const q=pageById(L.to); if(q) goDest(q, L.ty, true); else toast('That page is no longer in this document'); return; }
  if(L.to){ const q=S.pages.find(x=>x.src===L.to.src && x.idx===L.to.idx); if(!q){ toast('That page is no longer in this document'); return; } goDest(q, destY(q, L.to.left, L.to.top), true); return; }
  if(L.toc){ const ents=(linkCache[`${p.src}:${p.idx}:${p.rot}`]||[]).filter(l=>l.toc).map(l=>l.toc);
    const slow=!tocTextReady(); if(slow) busy(true,'Finding that section…');
    try{ const t=(await resolveToc(ents))[ents.indexOf(L.toc)]; if(t) goDest(t.page, t.y, true); } finally { if(slow) busy(false); } }
}

// ----- contents pages: "1.2 Summary ........ 5" -----
async function tocEntries(p){
  const runs=await getRuns(p); if(runs.length<3) return [];
  const sorted=[...runs].sort((a,b)=>a.base-b.base || a.x-b.x); const lines=[];
  for(const r of sorted){ const l=lines[lines.length-1]; if(l && Math.abs(l.base-r.base)<r.size*0.45) l.runs.push(r); else lines.push({base:r.base, runs:[r]}); }
  const out=[];
  for(const l of lines){
    l.runs.sort((a,b)=>a.x-b.x);
    const text=l.runs.map(r=>r.str).join(' ').replace(/\s+/g,' ').trim();
    const m=text.match(/^(.*?[^.\s·…_])\s*(?:[.·…_]\s*){3,}(\d{1,4})$/); if(!m) continue;
    const title=m[1].trim(); if(title.length<2) continue;
    const x0=l.runs[0].x, x1=Math.max(...l.runs.map(r=>r.x+r.w)), size=Math.max(...l.runs.map(r=>r.size));
    out.push({title, num:+m[2], x:x0-2, y:l.base-size*0.95, w:x1-x0+4, h:size*1.25, indent:x0, src:p.src, idx:p.idx});
  }
  return out.length>=3 ? out : [];
}
const normT = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const tocTextReady = () => S.pages.every(q=>!q.src || runCache[`${q.src}:${q.idx}:${q.rot}`]);
// Which page each contents entry points to. The printed numbers often don't match the PDF's own page numbers
// (a cover, or contents generated before other pages were added), so look for each heading in the document
// and use the printed numbers only to choose between matches and for headings that can't be found.
async function resolveToc(ents){
  const texts=[]; for(const q of S.pages) texts.push(normT((await getRuns(q)).map(r=>r.str).join(' ')));
  const tocPages=new Set(ents.map(e=>S.pages.findIndex(q=>q.src===e.src && q.idx===e.idx)));
  const hits=ents.map(e=>{ const t=normT(e.title); if(t.length<3) return []; const h=[]; texts.forEach((tx,i)=>{ if(!tocPages.has(i) && tx.includes(t)) h.push(i); }); return h; });
  const votes={}; ents.forEach((e,k)=>{ for(const i of hits[k]) votes[i+1-e.num]=(votes[i+1-e.num]||0)+1; });
  const off=+((Object.entries(votes).sort((a,b)=>b[1]-a[1])[0]||['0'])[0]);
  const res=[];
  for(let k=0;k<ents.length;k++){
    const want=ents[k].num+off-1; let i=hits[k].length ? hits[k].reduce((b,h)=>Math.abs(h-want)<Math.abs(b-want)?h:b) : want;
    i=Math.max(0, Math.min(S.pages.length-1, i)); const q=S.pages[i];
    // land on the heading itself
    const words=normT(ents[k].title).split(' ').slice(0,3).join(' '); let y=null;
    for(const r of await getRuns(q)){ if(words && normT(r.str).startsWith(words)){ y=Math.max(0, r.y-6); break; } }
    res.push({page:q, y});
  }
  return res;
}
// Build bookmarks (and real links on the contents page) from a contents page that has neither
async function bookmarksFromContents(){
  busy(true,'Reading the contents page…');
  try{
    const ents=[]; for(const q of S.pages.slice(0,20)){ const e=await tocEntries(q); for(const x of e) ents.push({...x, pid:q.id}); }
    if(!ents.length){ busy(false); toast("Couldn't find a contents page (lines like “1.2 Summary ....... 5”) in the first 20 pages"); return; }
    busy(true,'Finding each section…');
    const tg=await resolveToc(ents);
    const b=snap();
    // the same heading listed twice (two contents lists) becomes one bookmark
    const seen=new Set(), flat=[];
    ents.forEach((e,k)=>{ const key=normT(e.title); if(seen.has(key)) return; seen.add(key); flat.push({e, t:tg[k]}); });
    const numbered=flat.filter(f=>/^\d+(\.\d+)*\.?\s/.test(f.e.title)).length > flat.length/2;
    const indents=[...new Set(flat.map(f=>Math.round(f.e.indent/4)))].sort((a,b)=>a-b);
    const level=f=>{ const m=f.e.title.match(/^(\d+(?:\.\d+)*)\.?\s/); if(numbered) return m ? m[1].split('.').filter(Boolean).length-1 : 0; return indents.indexOf(Math.round(f.e.indent/4)); };
    const root=[]; const stack=[];
    for(const f of flat){ const lv=Math.max(0,level(f)); const node={id:nid('b'), title:f.e.title, pid:f.t.page.id, y:f.t.y, kids:[]};
      while(stack.length>lv) stack.pop(); (stack.length ? stack[stack.length-1].kids : root).push(node);
      stack.push(node); while(stack.length<lv+1) stack.push(node); }
    S.outline=root; root.forEach(n=>{ if(n.kids.length) S.bmOpen.add(n.id); });
    // make the contents page itself clickable in the saved file too
    let nl=0;
    ents.forEach((e,k)=>{ const q=pageById(e.pid); if(!q || tg[k].page===q) return;
      (q.links=q.links||[]).push({id:nid('l'), x:e.x, y:e.y, w:e.w, h:e.h, to:tg[k].page.id, ty:tg[k].y}); nl++; });
    commit(b); S.sideTab='marks'; renderThumbs(); renderAllOverlays();
    toast(`Added ${flat.length} bookmark${flat.length>1?'s':''}${nl?' and made the contents page clickable':''}`,'Undo',undo);
  }catch(e){ console.error(e); toast('Could not read the contents page'); }
  busy(false);
}

// ----- the Bookmarks tab -----
function sideTabs(){
  let n=0; walkBm(()=>n++);
  const na=(S.attach||[]).length;
  return `<div class="stabs"><button data-st="pages" class="${S.sideTab!=='marks'&&S.sideTab!=='files'?'on':''}">Pages</button><button data-st="marks" class="${S.sideTab==='marks'?'on':''}" title="Bookmarks">Bookmarks${n?` <span class="cnt">${n}</span>`:''}</button><button data-st="files" class="${S.sideTab==='files'?'on':''}" title="Attached files">${icon('clip',13)}${na?`<span class="cnt">${na}</span>`:''}</button></div>`;
}
function bookmarksHtml(){
  let h=`<div class="shead">${sideTabs()}<div class="bmtools"><button class="btn" data-bm="add" title="Bookmark the page you're looking at">${icon('plus',14)}Add</button>`;

  h+=`</div></div>`;
  if(!S.outline || !S.outline.length)
    return h+`<div class="bmempty">This PDF has no bookmarks.<button class="btn out" data-bm="fromtoc">${icon('link',15)}Create from contents page</button><small>Reads a contents page like “1.2 Summary ....... 5” and links each line to its section. Or go to a page and press Add.</small></div>`;
  const cur=S.pages[S.cur];
  const row=(n,d)=>{ const q=n.pid?pageById(n.pid):null; const dead=!n.url && !q; const open=S.bmOpen.has(n.id);
    let r=`<div class="bm${dead?' dead':''}${q&&q===cur?' cur':''}" data-bid="${n.id}" data-pi="${q?S.pages.indexOf(q):-1}" style="padding-left:${2+d*14}px" title="${esc(n.title)}">`+
      (n.kids.length?`<button class="tw" data-bm="tog" title="${open?'Close':'Open'}">${icon(open?'chevd':'chevr',13)}</button>`:'<span class="tw"></span>')+
      `<span class="bt">${esc(n.title)}</span>${q?`<span class="bp">${S.pages.indexOf(q)+1}</span>`:n.url?`<span class="bp">${icon('link',12)}</span>`:''}`+
      `<span class="ba"><button data-bm="here" title="Point this bookmark at the page you're looking at">${icon('bookmark',13)}</button><button data-bm="ren" title="Rename">${icon('pencil',13)}</button><button class="del" data-bm="del" title="Delete">${icon('trash',13)}</button></span></div>`;
    if(open) for(const k of n.kids) r+=row(k,d+1);
    return r; };
  return h+`<div class="bms">${S.outline.map(n=>row(n,0)).join('')}</div>`;
}
function askText(title, def, okLabel='OK'){
  return modal(`<h2>${esc(title)}</h2><div class="pw"><input value="${esc(def||'')}" spellcheck="true"></div><div class="foot"><button class="btn out" data-c>Cancel</button><button class="btn pri" data-o>${esc(okLabel)}</button></div>`,
    (m,close)=>{ const i=m.querySelector('input'); i.focus(); i.select(); const go=()=>{ const v=i.value.replace(/\s+/g,' ').trim(); if(v) close(v); };
      m.querySelector('[data-c]').onclick=()=>close(null); m.querySelector('[data-o]').onclick=go; i.onkeydown=e=>{ if(e.key==='Enter') go(); }; });
}
// what you're looking at: the current page and how far down it
function viewSpot(){ const q=S.pages[S.cur]; const el=q&&pageEl(q.id); if(!el) return null; return {q, y:Math.max(0, (viewer.scrollTop+16-el.offsetTop)/S.zoom)}; }
async function guessHeading(q, y){
  const runs=(await getRuns(q)).filter(r=>r.y>=y-4 && r.str.trim().length>1); if(!runs.length) return '';
  const top=runs.slice().sort((a,b)=>a.y-b.y).slice(0,12); const big=top.reduce((b,r)=>r.size>b.size+0.5?r:b, top[0]);
  // only a heading (text larger than the page's usual size) makes a good name
  const sizes=runs.map(r=>r.size).sort((a,b)=>a-b), med=sizes[sizes.length>>1];
  return big.size>med*1.15 ? big.str.trim().slice(0,120) : '';
}
async function bookmarkAction(act, id){
  if(act==='add'){
    const v=viewSpot(); if(!v) return; const title=await askText('Add bookmark', (await guessHeading(v.q, v.y)) || `Page ${S.cur+1}`, 'Add'); if(!title) return;
    const b=snap(); const node={id:nid('b'), title, pid:v.q.id, y:v.y<8?null:v.y, kids:[]};
    S.outline=S.outline||[];
    // keep bookmarks in page order: after the last top-level one that comes before this spot
    const pos=n=>{ const q=n.pid&&pageById(n.pid); return q ? S.pages.indexOf(q)*1e5+(n.y||0) : -1; };
    const me=S.cur*1e5+(node.y||0); let at=S.outline.length; for(let i=0;i<S.outline.length;i++){ if(pos(S.outline[i])>me){ at=i; break; } }
    S.outline.splice(at,0,node); commit(b); renderThumbs(); toast('Bookmark added'); return;
  }
  if(act==='all'){ let any=false; walkBm(n=>{ if(n.kids.length && !S.bmOpen.has(n.id)) any=true; });
    walkBm(n=>{ if(n.kids.length){ if(any) S.bmOpen.add(n.id); else S.bmOpen.delete(n.id); } }); renderThumbs(); return; }
  if(act==='fromtoc'){ bookmarksFromContents(); return; }
  const f=findBm(id); if(!f) return; const n=f.n;
  if(act==='tog'){ S.bmOpen.has(id) ? S.bmOpen.delete(id) : S.bmOpen.add(id); renderThumbs(); return; }
  if(act==='ren'){ const t=await askText('Rename bookmark', n.title, 'Rename'); if(!t || t===n.title) return; const b=snap(); n.title=t; commit(b); renderThumbs(); return; }
  if(act==='here'){ const v=viewSpot(); if(!v) return; const b=snap(); n.pid=v.q.id; n.y=v.y<8?null:v.y; delete n.url; commit(b); renderThumbs(); toast(`“${n.title}” now goes to page ${S.cur+1}`); return; }
  if(act==='del'){ const b=snap(); f.list.splice(f.i,1); commit(b); renderThumbs(); toast(n.kids.length?'Bookmark and the ones inside it deleted':'Bookmark deleted','Undo',undo); return; }
  if(act==='go'){

function writeOutline(out, pageOf){
  const N=PDFLib.PDFName, ctx=out.context, cat=out.catalog;

  const top=(S.outline||[]).flatMap(usable);
  if(!top.length){ cat.delete(N.of('Outlines')); return 0; }
  let total=0;
  const build=(items, parentRef)=>{
    const refs=items.map(()=>ctx.nextRef()); let visible=0;
    items.forEach((it,i)=>{
      const d=ctx.obj({}); d.set(N.of('Title'), PDFLib.PDFHexString.fromText(it.n.title)); d.set(N.of('Parent'), parentRef);
      if(i>0) d.set(N.of('Prev'), refs[i-1]); if(i<items.length-1) d.set(N.of('Next'), refs[i+1]);
      if(it.n.url) d.set(N.of('A'), ctx.obj({S:'URI', URI:PDFLib.PDFString.of(it.n.url)}));

        const ref=ctx.register(ctx.obj({Type:'Annot', Subtype:'Link', Rect:[Math.min(a[0],b[0]), Math.min(a[1],b[1]), Math.max(a[0],b[0]), Math.max(a[1],b[1])], Border:[0,0,0], A:ctx.obj({S:'URI', URI:PDFLib.PDFString.of(l.url)})}));

const formCache={};
async function getFields(p){

    const pg=await S.sources[p.src].doc.getPage(p.idx+1); const vp=pg.getViewport({scale:1, rotation:p.rot});
    for(const a of await pg.getAnnotations({intent:'display'})){

      const type = a.fieldType==='Tx' ? 'text' : a.fieldType==='Btn' ? (a.checkBox?'check':a.radioButton?'radio':null) : a.fieldType==='Ch' ? (a.combo?'combo':'list') : null;

}
async function buildForms(p, el){

function syncFormInputs(){

async function countFields(){ let n=0; const names=new Set(); for(const p of S.pages){ for(const f of await getFields(p)) names.add(p.src+'|'+f.name); } S.fieldCount=names.size; return names.size; }

function renderVisible(){ for(const id of visible){ const p=pageById(id), el=pageEl(id); if(p&&el) renderCanvas(p,el); } }
async function renderCanvas(p, el){

/* thumbnails */
const thumbCache = {}; let thumbQ=[], thumbRunning=false;
function sideHead(){

    <div class="row2"><button class="btn out" data-s="extract" title="Save the selected pages as a new PDF">${icon('extract',15)}Extract</button><button class="btn out ib" data-s="rotate" title="Rotate selected">${icon('rotate',15)}</button><button class="btn out ib danger" data-s="delete" title="Delete selected">${icon('trash',15)}</button></div></div>`;

}

      <div class="acts">${i>0?`<button data-a="up" title="Move page up">${icon('up',14)}</button>`:''}${i<S.pages.length-1?`<button data-a="down" title="Move page down">${icon('down',14)}</button>`:''}<button data-a="rot" title="Rotate page">${icon('rotate',14)}</button><button class="del" data-a="del" title="Delete page">${icon('trash',14)}</button></div>`;

function setThumbImg(p){ const t=$('side').querySelector(`.thumb[data-pid="${p.id}"] .tb`); if(t&&!t.querySelector('img')) t.innerHTML=`<img src="${thumbCache[thumbKey(p)]}" alt="">`; }

/* ---------- geometry ---------- */
const mctx = document.createElement('canvas').getContext('2d');
const useOrig = a => !!(a && a.of && !a.ofOff);

// Read the rendered page: background = most common colour around the text, text = the colour that stands out most inside it
function sampleColors(p, box){
  const el=pageEl(p.id); const cv=el && el.querySelector('canvas'); if(!cv || !cv.width) return null;
  const k=cv.width/dims(p)[0], pad=3;
  const x0=Math.max(0,Math.floor((box.x-pad)*k)), y0=Math.max(0,Math.floor((box.y-pad)*k));
  const x1=Math.min(cv.width,Math.ceil((box.x+box.w+pad)*k)), y1=Math.min(cv.height,Math.ceil((box.y+box.h+pad)*k));
  if(x1-x0<2||y1-y0<2) return null;
  let d; try{ d=cv.getContext('2d').getImageData(x0,y0,x1-x0,y1-y0).data; }catch(e){ return null; }
  const W=x1-x0, H=y1-y0, ring=Math.max(2,Math.round(pad*k*0.8)); const counts=new Map(); const inner=[];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; const c=[d[i],d[i+1],d[i+2]];
    if(x<ring||y<ring||x>=W-ring||y>=H-ring){ const q=(c[0]>>3)<<10|(c[1]>>3)<<5|(c[2]>>3); const e=counts.get(q)||{n:0,r:0,g:0,b:0}; e.n++; e.r+=c[0]; e.g+=c[1]; e.b+=c[2]; counts.set(q,e); }
    else inner.push(c); }
  const modeOf = list => { const m=new Map(); for(const c of list){ const q=(c[0]>>3)<<10|(c[1]>>3)<<5|(c[2]>>3); const e=m.get(q)||{n:0,r:0,g:0,b:0}; e.n++; e.r+=c[0]; e.g+=c[1]; e.b+=c[2]; m.set(q,e); } let b=null; for(const e of m.values()) if(!b||e.n>b.n) b=e; return b; };
  // the space between and around the letters is almost all background, so its most common colour wins;
  // the ring outside the text is only a fallback (it can sit on table borders or row shading)
  let best=modeOf(inner); if(!best || best.n < inner.length*0.3){ let r=null; for(const e of counts.values()) if(!r||e.n>r.n) r=e; best=r||best; }
  if(!best) return null;
  const bg=[best.r/best.n, best.g/best.n, best.b/best.n];
  const dist=c=>Math.hypot(c[0]-bg[0],c[1]-bg[1],c[2]-bg[2]);
  const far=inner.filter(c=>dist(c)>60).sort((a,b)=>dist(b)-dist(a)); let fg=null;
  if(far.length){ const top=far.slice(0,Math.max(1,Math.floor(far.length*0.12))); fg=[0,1,2].map(j=>top.reduce((s,c)=>s+c[j],0)/top.length); }
  const hex=c=>'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  return {bg:hex(bg), fg:fg?hex(fg):null};
}

async function runCompare(oldPages, oldName, tempSrc){

    const pages=newPages.map(p=>({...JSON.parse(JSON.stringify(p)), id:nid('p')}));
    const srcs=new Set(newDoc.srcs);

async function applyRedactions(bytes, list){
  const idxs=list.map((p,i)=>p.annots.some(a=>a.type==='redact')?i:-1).filter(i=>i>=0);
  S.lastSave.redacted=idxs.length;
  if(!idxs.length) return bytes;
  const jd=await pdfjsLib.getDocument({...PDFJS_OPTS, data:bytes.slice()}).promise;
  const doc=await PDFDocument.load(bytes, {ignoreEncryption:true, updateMetadata:false});
  try{
    for(const i of idxs){
      const p=list[i]; const pg=await jd.getPage(i+1); const v=pg.view; const w=v[2]-v[0], h=v[3]-v[1];
      const sc=Math.min(200/72, 4200/Math.max(w,h)); const vp=pg.getViewport({scale:sc, rotation:0});
      const cv=document.createElement('canvas'); cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height);
      const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
      await pg.render({canvasContext:ctx, viewport:vp, annotationMode:pdfjsLib.AnnotationMode.ENABLE}).promise;
      ctx.fillStyle='#000';
      for(const a of p.annots.filter(a=>a.type==='redact')){
        const q=[toPdf(p,a.x,a.y), toPdf(p,a.x+a.w,a.y+a.h)].map(([X,Y])=>[(X-v[0])*sc, (v[3]-Y)*sc]);
        const x0=Math.floor(Math.min(q[0][0],q[1][0])), y0=Math.floor(Math.min(q[0][1],q[1][1]));
        ctx.fillRect(x0, y0, Math.ceil(Math.abs(q[0][0]-q[1][0]))+1, Math.ceil(Math.abs(q[0][1]-q[1][1]))+1);
      }
      const img=await doc.embedJpg(dataUrlBytes(cv.toDataURL('image/jpeg',0.92)));
      const rot=doc.getPage(i).getRotation().angle;
      doc.removePage(i); const np=doc.insertPage(i,[w,h]); np.setMediaBox(v[0],v[1],w,h);
      np.drawImage(img,{x:v[0], y:v[1], width:w, height:h}); np.setRotation(degrees(rot));
    }
  } finally { jd.destroy(); }

  return clean.save();
}

async function printDoc(){

/* ---------- Recent files and session restore (installed app) ---------- */
// Kept in this browser's own storage (IndexedDB) on this device only.
const STORE_OK = BUILD==='app' && 'indexedDB' in window;
let dbP=null;
function idb(){ if(!dbP) dbP=new Promise((res,rej)=>{ const r=indexedDB.open('folio',1);
  r.onupgradeneeded=()=>{ const db=r.result; for(const n of ['recent','session','blobs']) if(!db.objectStoreNames.contains(n)) db.createObjectStore(n,{keyPath:'k'}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return dbP; }
async function tx(store, mode, fn){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction(store,mode); const st=t.objectStore(store); let out; const r=fn(st); if(r) r.onsuccess=()=>{ out=r.result; };
  t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const dbAll = store => tx(store,'readonly',st=>st.getAll()).then(l=>window.__folioHandle?window.__folioHandle(l):l);
const dbPut = (store,v) => tx(store,'readwrite',st=>st.put(v));
const dbDel = (store,k) => tx(store,'readwrite',st=>st.delete(k));
const RECENT_MAX=12, RECENT_KEEP_BYTES=40*1024*1024;
async function rememberRecent(name, bytes, handle){
  if(!STORE_OK || !name) return;
  try{ const all=await dbAll('recent'); const now=Date.now();
    // the same file again (same place on disk, or same name and size) replaces its old entry
    for(const r of all){ let same = r.name===name && r.size===bytes.length;
      if(!same && handle && r.handle){ try{ same=await r.handle.isSameEntry(handle); }catch(_){} }
      if(same) await dbDel('recent', r.k); }
    // files opened from disk are reopened from disk; others keep a copy so they can be reopened
    await dbPut('recent', {k:nid('r'), name, size:bytes.length, when:now, handle:handle||null, bytes: handle||bytes.length>RECENT_KEEP_BYTES ? null : bytes.slice()});
    const left=(await dbAll('recent')).sort((a,b)=>b.when-a.when);
    for(const r of left.slice(RECENT_MAX)) await dbDel('recent', r.k);
    renderRecent();
  }catch(e){ console.warn('recent', e); }
}
function ago(t){ const m=(Date.now()-t)/60000; if(m<1) return 'just now'; if(m<60) return Math.round(m)+' min ago'; const h=m/60; if(h<24) return Math.round(h)+' h ago';
  const d=new Date(t); return d.toLocaleDateString(undefined,{day:'numeric', month:'short'}); }
let restorable=[];
async function renderRecent(){
  const el=$('recent'); if(!el || !STORE_OK) return;
  try{
    const list=(await dbAll('recent')).sort((a,b)=>b.when-a.when);
    restorable=await findRestorable();
    if(S.pages.length){ el.innerHTML=''; return; }
    const nDocs=restorable.reduce((t,r)=>t+r.docs.length,0), nDirty=restorable.reduce((t,r)=>t+r.docs.filter(d=>d.dirty).length,0);
    let h='';
    if(nDocs) h+=`<button class="restore" data-restore>${icon('open',18)}<span>Reopen your last session<small>${nDocs} document${nDocs>1?'s':''}${nDirty?`, ${nDirty} with unsaved changes`:''}</small></span></button>`;
    if(list.length){ h+=`<div class="rh"><b>Recent</b><button data-rclear title="Forget the recent files list">Clear</button></div>`;
      h+=list.slice(0,8).map(r=>`<button class="ri" data-rk="${r.k}" title="${esc(r.name)}">${icon('file',16)}<span>${esc(r.name)}</span><em>${ago(r.when)}</em><i class="x" data-rdel="${r.k}" title="Remove from list">×</i></button>`).join(''); }
    el.innerHTML=h;
  }catch(e){ console.warn('recent', e); el.innerHTML=''; }
}
async function openRecent(k){
  const r=(await dbAll('recent')).find(x=>x.k===k); if(!r) return;
  if(r.handle){
    try{ const opts={mode:'readwrite'};
      if(r.handle.queryPermission && (await r.handle.queryPermission(opts))!=='granted' && (await r.handle.requestPermission(opts))!=='granted'){
        if((await r.handle.requestPermission({mode:'read'}))!=='granted') throw Object.assign(new Error('denied'),{name:'NotAllowedError'}); }
      await openFile(await r.handle.getFile(), r.handle); return;
    }catch(e){ console.warn(e);
      if(e.name==='NotAllowedError'){ toast('Folio needs your permission to open that file'); return; }
      await dbDel('recent', k); renderRecent(); toast(`${r.name} isn't where it was any more (moved, renamed or deleted)`); return; }
  }
  if(r.bytes){ await openBytes(new Uint8Array(r.bytes), r.name); rememberRecent(r.name, new Uint8Array(r.bytes), null); return; }
  await dbDel('recent', k); renderRecent(); toast(`${r.name} is too large to keep a copy of. Open it again from your files.`);
}
$('recent').addEventListener('click', async e=>{
  const del=e.target.closest('[data-rdel]'); if(del){ e.stopPropagation(); await dbDel('recent', del.dataset.rdel); renderRecent(); return; }
  if(e.target.closest('[data-rclear]')){ for(const r of await dbAll('recent')) await dbDel('recent', r.k); renderRecent(); return; }

// Session: every window keeps a note of its open tabs (and unsaved edits) so they can be reopened after Folio is closed
const WIN_ID = nid('w')+Date.now().toString(36);   // one per page load
const savedBlobs=new Set(); let sessT=null, sessBusy=false, sessReady=false;
function sessionSoon(delay=1500){ if(!STORE_OK || !sessReady) return; clearTimeout(sessT); sessT=setTimeout(saveSession, delay); }
function sessionDoc(d){
  const live = d===active; const g = k => live ? S[k] : d[k];
  const pages=g('pages')||[]; const imgIds=new Set(); for(const p of pages) for(const a of p.annots) if(a.imgId) imgIds.add(a.imgId);
  const images={}; for(const id of imgIds) if(S.images[id]) images[id]=S.images[id];
  const srcIds=[...d.srcs].filter(id=>S.sources[id] && pages.some(p=>p.src===id));
  return {pages, fileName:g('fileName'), forms:g('forms'), fieldCount:g('fieldCount'), ocr:g('ocr'), zoom:g('zoom'), dirty: live ? isDirty() : !!d.dirty, fileHandle:g('fileHandle')||null, images, srcIds,
    outline:g('outline')||null, outline0:g('outline0')||'null', bmOpen:[...(g('bmOpen')||[])], sideTab:g('sideTab')||'pages', marks:g('marks')||{hf:null,wm:null}, attach:g('attach')||[], attach0:g('attach0')||'[]', attachStore:g('attachStore')||{}};
}
async function saveSession(closing){
  if(sessBusy && !closing){ sessionSoon(800); return; }
  if(S.editing && !closing){ sessionSoon(2000); return; }   // wait until the text being typed is finished
  sessBusy=true;
  try{
    const open=docs.filter(d=>docPages(d).length && !d.moving), list=open.map(sessionDoc);
    const total=list.reduce((t,d)=>t+d.srcIds.reduce((u,id)=>u+(S.sources[id]?.bytes.length||0),0),0);
    if(!list.length || total>300*1024*1024){ await dbDel('session', WIN_ID); }
    else {
      for(const d of list) for(const id of d.srcIds) if(!savedBlobs.has(id)){ const src=S.sources[id]; await dbPut('blobs',{k:id, bytes:src.bytes, name:src.name, enc:src.enc}); savedBlobs.add(id); }
      let rec; try{ rec={k:WIN_ID, when:Date.now(), beat:closing?0:Date.now(), active:Math.max(0,open.indexOf(active)), docs:list}; await dbPut('session', rec); }
      catch(e){ // a file handle that can't be stored: keep the session without it
        for(const d of list) d.fileHandle=null; await dbPut('session', {...rec, docs:list}); }
    }
  }catch(e){ console.warn('session', e); }
  sessBusy=false;
}
async function heartbeat(){ if(!STORE_OK || !sessReady) return; try{ const r=(await dbAll('session')).find(x=>x.k===WIN_ID); if(r){ r.beat=Date.now(); await dbPut('session', r); } }catch(_){} }
// sessions of Folio windows that are closed (not still open somewhere else)
async function findRestorable(){ if(!STORE_OK) return []; const now=Date.now();
  return (await dbAll('session')).filter(r=>r.k!==WIN_ID && r.docs && r.docs.length && now-(r.beat||0)>45000 && now-(r.when||0)<30*864e5).sort((a,b)=>a.when-b.when); }
async function cleanBlobs(){ try{ const keep=new Set(); for(const r of await dbAll('session')) for(const d of r.docs||[]) for(const id of d.srcIds||[]) keep.add(id);
  for(const id of savedBlobs) keep.add(id);
  for(const b of await tx('blobs','readonly',st=>st.getAllKeys())) if(!keep.has(b)) await dbDel('blobs', b); }catch(e){ console.warn(e); } }
async function restoreSession(){
  const recs=await findRestorable(); if(!recs.length){ renderRecent(); return; }
  busy(true,'Reopening your documents…'); let n=0, failed=0;
  const blobs={}; for(const b of await dbAll('blobs')) blobs[b.k]=b;
  for(const r of recs){
    for(const d of r.docs){
      const sources=d.srcIds.map(id=>blobs[id] && {id, bytes:new Uint8Array(blobs[id].bytes), name:blobs[id].name, enc:blobs[id].enc});
      if(sources.some(x=>!x)){ failed++; continue; }
      await receiveDoc({...d, sources}); n++; busy(true,'Reopening your documents…');
    }
    await dbDel('session', r.k);
  }
  busy(false);
  const want=recs.length===1 ? docs.filter(d=>docPages(d).length).slice(-n)[recs[0].active||0] : null;
  if(want && want!==active) activate(want);
  // the documents now belong to this window
  for(const id of Object.keys(S.sources)) savedBlobs.delete(id);
  await saveSession(); cleanBlobs();
  if(n) toast(`Reopened ${n} document${n>1?'s':''}`+(failed?` (${failed} couldn't be restored)`:''));
  else toast('Your last session could not be restored');
}
if(STORE_OK){
  setInterval(heartbeat, 20000);
  addEventListener('pagehide', ()=>{ clearTimeout(sessT); closeEditor(); saveSession(true); });
  window.__folioSaveSession=()=>{ clearTimeout(sessT); closeEditor(); return saveSession(true); };
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden'){ clearTimeout(sessT); saveSession(); } });
  // after start-up (and any file Windows asked us to open), offer to bring back the last session
  setTimeout(async()=>{ sessReady=true;
    try{ const recs=await findRestorable(); renderRecent();
      const n=recs.reduce((t,r)=>t+r.docs.length,0);
      if(n && S.pages.length) toast(`Reopen the ${n} document${n>1?'s':''} from your last session?`, 'Reopen', restoreSession);
      if(!n) cleanBlobs();
      sessionSoon(100);
    }catch(e){ console.warn(e); } }, 900);
}

    <div class="foot"><button class="btn out" data-c>Cancel</button><button class="btn pri" data-o>Remove</button></div>`,
    (m,close)=>{ m.querySelector('[data-c]').onclick=()=>close(null); const o=m.querySelector('[data-o]'); o.focus(); o.onclick=()=>{ const f=m.querySelector('[data-foot]'); close({foot:f&&f.checked}); }; });
